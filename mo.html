<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سينما أونلاين</title>
  <!-- مكتبة تشغيل فيديو m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1015;
      color: #fff;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    header {
      background: #181920;
      padding: 15px 25px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .logo { font-size: 22px; font-weight: bold; color: #e50914; }

    .search-box {
      display: flex;
      gap: 8px;
      flex: 1;
      max-width: 400px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #232530;
      color: #fff;
      outline: none;
    }

    .search-box button {
      padding: 10px 18px;
      background: #e50914;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 15px 25px;
      background: #13141a;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: #232530;
      color: #ddd;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s;
    }
    .cat-btn.active, .cat-btn:hover {
      background: #e50914;
      color: #fff;
    }

    .container {
      max-width: 1300px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .card {
      background: #181920;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
    }

    .poster-wrap {
      position: relative;
      width: 100%;
      padding-top: 145%;
      background: #232530;
    }
    .poster-wrap img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .card h3 {
      font-size: 13px;
      line-height: 1.4;
      padding: 12px;
      color: #eee;
      flex: 1;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 35px;
    }
    .pagination button {
      padding: 10px 20px;
      background: #232530;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
    }
    .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Modal Player */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: #181920;
      border-radius: 10px;
      width: 100%;
      max-width: 800px;
      overflow: hidden;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #e50914;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 16px;
      z-index: 10;
    }
    video { width: 100%; max-height: 480px; background: #000; display: block; }
    .video-title { padding: 15px; font-size: 16px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">سينما</div>
    <form class="search-box" onsubmit="handleSearch(event)">
      <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل..." />
      <button type="submit">بحث</button>
    </form>
  </header>

  <nav class="categories" id="catList">
    <button class="cat-btn active" onclick="loadCategory('', this)">الكل</button>
  </nav>

  <main class="container">
    <div id="movieGrid" class="grid">جاري تحميل الأفلام...</div>
    <div class="pagination">
      <button id="prevBtn" onclick="changePage(-1)" disabled>السابق</button>
      <span id="pageNumber" style="align-self:center;">صفحة 1</span>
      <button id="nextBtn" onclick="changePage(1)">التالي</button>
    </div>
  </main>

  <!-- نافذة المشغل المنبثقة -->
  <div class="modal" id="playerModal" onclick="closePlayer(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closePlayer()">✕</button>
      <video id="videoPlayer" controls autoplay></video>
      <div class="video-title" id="playerTitle"></div>
    </div>
  </div>

  <script>
    const API = 'https://mo.m737217130.workers.dev/';
    let currentPage = 1;
    let currentCategory = '';
    let currentSearch = '';
    let hls = null;

    // جلب التصنيفات
    async function fetchCategories() {
      try {
        const res = await fetch(`${API}?action=categories`);
        const cats = await res.json();
        const container = document.getElementById('catList');
        cats.forEach(cat => {
          const btn = document.createElement('button');
          btn.className = 'cat-btn';
          btn.innerText = cat.name;
          btn.onclick = () => loadCategory(cat.slug, btn);
          container.appendChild(btn);
        });
      } catch (e) {
        console.error('خطأ في جلب التصنيفات:', e);
      }
    }

    // جلب الأفلام
    async function fetchMovies() {
      const grid = document.getElementById('movieGrid');
      grid.innerHTML = '<p>جاري التحميل...</p>';

      let url = `${API}?action=posts&page=${currentPage}`;
      if (currentSearch) {
        url = `${API}?action=search&search=${encodeURIComponent(currentSearch)}&page=${currentPage}`;
      } else if (currentCategory) {
        url = `${API}?action=posts&category=${currentCategory}&page=${currentPage}`;
      }

      try {
        const res = await fetch(url);
        const data = await res.json();
        grid.innerHTML = '';

        if (!data.posts || data.posts.length === 0) {
          grid.innerHTML = '<p>لا توجد نتائج لعرضها.</p>';
          return;
        }

        data.posts.forEach(post => {
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => playMovie(post.realid, post.title);
          card.innerHTML = `
            <div class="poster-wrap">
              <img src="${post.thumbnail}" alt="${post.title}" loading="lazy" />
            </div>
            <h3>${post.title}</h3>
          `;
          grid.appendChild(card);
        });

        document.getElementById('pageNumber').innerText = `صفحة ${currentPage}`;
        document.getElementById('prevBtn').disabled = currentPage <= 1;
      } catch (e) {
        grid.innerHTML = '<p>حدث خطأ أثناء تحميل البيانات.</p>';
      }
    }

    // تشغيل الفيديو عند الضغط على البطاقة
    async function playMovie(realid, title) {
      const modal = document.getElementById('playerModal');
      const video = document.getElementById('videoPlayer');
      const titleEl = document.getElementById('playerTitle');

      titleEl.innerText = 'جاري تحضير سيرفر المشاهدة...';
      modal.classList.add('show');

      try {
        const res = await fetch(`${API}?action=stream&realid=${realid}`);
        const streamData = await res.json();

        if (!streamData.url) {
          alert('تعذر استخراج رابط المشاهدة لهذا المحتوى.');
          closePlayer();
          return;
        }

        titleEl.innerText = title;

        if (Hls.isSupported()) {
          if (hls) hls.destroy();
          hls = new Hls();
          hls.loadSource(streamData.url);
          hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = streamData.url;
        }
      } catch (e) {
        alert('حدث خطأ أثناء جلب الفيديو.');
        closePlayer();
      }
    }

    function closePlayer() {
      const modal = document.getElementById('playerModal');
      const video = document.getElementById('videoPlayer');
      modal.classList.remove('show');
      video.pause();
      if (hls) {
        hls.destroy();
        hls = null;
      }
    }

    function loadCategory(slug, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = slug;
      currentSearch = '';
      currentPage = 1;
      fetchMovies();
    }

    function handleSearch(e) {
      e.preventDefault();
      const val = document.getElementById('searchInput').value.trim();
      if (!val) return;
      currentSearch = val;
      currentPage = 1;
      fetchMovies();
    }

    function changePage(direction) {
      currentPage += direction;
      if (currentPage < 1) currentPage = 1;
      fetchMovies();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // بدء التشغيل
    fetchCategories();
    fetchMovies();
  </script>
</body>
</html>
