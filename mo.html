<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Alameeere Movies</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; outline: none; }
    body {
      background: #0f1015;
      color: #fff;
      min-height: 100vh;
      padding-bottom: 50px;
      overflow-x: hidden;
    }

    /* ===== Splash Screen ===== */
    .splash-screen {
      position: fixed; inset: 0;
      background: #000;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 99999; cursor: pointer;
      transition: opacity 0.6s ease;
    }
    .splash-title { text-align: center; }
    .splash-title h1 {
      font-size: 3.5rem; font-weight: 900;
      text-shadow: 0 0 25px rgba(255,255,255,0.25);
      letter-spacing: -1px;
    }
    .splash-title h2 {
      font-size: 1.75rem; /* 50% من حجم h1 */
      font-weight: 400;
      letter-spacing: 6px;
      color: #aaa;
      margin-top: -10px;
    }
    .splash-hint {
      position: absolute; bottom: 10%;
      font-size: 1.2rem; color: #888;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }

    /* ===== Header / Logo ===== */
    header {
      background: #181920;
      padding: 15px 25px;
      display: flex; flex-wrap: wrap;
      justify-content: space-between; align-items: center;
      gap: 15px; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .logo { line-height: 1; }
    .logo h1 { font-size: 24px; font-weight: 900; color: #fff; }
    .logo h2 {
      font-size: 12px; /* 50% من حجم h1 */
      color: #888; font-weight: 400;
      letter-spacing: 3px; margin-top: 2px;
    }

    .search-box { display: flex; gap: 8px; flex: 1; max-width: 400px; }
    .search-box input {
      width: 100%; padding: 10px 14px;
      border-radius: 6px; border: 1px solid #333;
      background: #232530; color: #fff; font-family: inherit;
    }
    .search-box button {
      padding: 10px 18px; background: #e50914;
      color: #fff; border: none; border-radius: 6px;
      cursor: pointer; font-weight: bold; font-family: inherit;
    }

    /* ===== Categories ===== */
    .categories {
      display: flex; gap: 10px; overflow-x: auto;
      padding: 15px 25px; background: #13141a;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: #232530; color: #ddd; border: 1px solid #333;
      padding: 8px 16px; border-radius: 20px;
      cursor: pointer; white-space: nowrap;
      transition: 0.2s; font-family: inherit; font-size: 0.95rem;
    }
    .cat-btn.active, .cat-btn:hover {
      background: #e50914; border-color: #e50914; color: #fff;
    }

    /* ===== Movies Grid ===== */
    .container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 20px;
    }
    .card {
      background: #181920; border-radius: 10px; overflow: hidden;
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
      display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-6px); box-shadow: 0 10px 20px rgba(0,0,0,0.6); }
    .poster-wrap { position: relative; width: 100%; padding-top: 145%; background: #232530; }
    .poster-wrap img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
    }
    .card h3 {
      font-size: 13px; line-height: 1.4; padding: 12px;
      color: #eee; flex: 1;
      overflow: hidden; text-overflow: ellipsis;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }

    /* ===== Focus (Remote / D-Pad) ===== */
    [tabindex="0"]:focus, .card:focus, .cat-btn:focus, button:focus, input:focus {
      outline: 3px solid #e50914 !important;
      outline-offset: 3px;
      transform: scale(1.04);
      box-shadow: 0 0 25px rgba(229,9,20,0.6);
      z-index: 10;
    }

    /* ===== Pagination ===== */
    .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 35px; align-items: center; }
    .pagination button {
      padding: 10px 20px; background: #232530; color: #fff;
      border: 1px solid #444; border-radius: 6px;
      cursor: pointer; font-family: inherit;
    }
    .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ===== Modal Player ===== */
    .modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.95); z-index: 999;
      justify-content: center; align-items: center; padding: 20px;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: #000; border-radius: 10px;
      width: 100%; max-width: 1000px;
      overflow: hidden; position: relative;
    }
    .close-btn {
      position: absolute; top: 10px; left: 10px;
      background: #e50914; color: #fff; border: none;
      border-radius: 50%; width: 36px; height: 36px;
      cursor: pointer; font-size: 18px; z-index: 10;
    }
    .video-wrapper { position: relative; background: #000; }
    video { width: 100%; max-height: 70vh; background: #000; display: block; }
    .video-title { padding: 15px; font-size: 16px; background: #111; }

    /* ===== Custom Player Controls ===== */
    .custom-controls {
      position: absolute; bottom: 0; left: 0; width: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
      padding: 15px 20px;
      display: flex; flex-direction: column; gap: 10px;
      opacity: 0; transition: opacity 0.3s;
    }
    .video-wrapper:hover .custom-controls, .custom-controls.active { opacity: 1; }
    .progress-bar { width: 100%; accent-color: #e50914; cursor: pointer; }
    .controls-row { display: flex; align-items: center; gap: 15px; }
    .controls-row button {
      background: none; border: none; color: white;
      font-size: 1.3rem; cursor: pointer; padding: 4px;
    }
    .controls-row select {
      font-size: 0.9rem; background: #222; color: #fff;
      padding: 5px; border-radius: 5px; border: 1px solid #333;
      font-family: inherit;
    }
    #volume-bar { width: 80px; accent-color: #e50914; }
    .time-display { font-size: 0.9rem; color: #ccc; }

    .player-loader {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8); padding: 20px 40px;
      border-radius: 10px; z-index: 5; color: #fff;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .splash-title h1 { font-size: 2.5rem; }
      .splash-title h2 { font-size: 1.25rem; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
      .card h3 { font-size: 11px; padding: 8px; }
      .logo h1 { font-size: 20px; }
    }
    @media (min-width: 1920px) {
      .splash-title h1 { font-size: 5.5rem; }
      .splash-title h2 { font-size: 2.75rem; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
      .logo h1 { font-size: 32px; }
      .logo h2 { font-size: 16px; }
      .card h3 { font-size: 16px; }
      .cat-btn { font-size: 1.2rem; padding: 12px 24px; }
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen" class="splash-screen">
    <div class="splash-title">
      <h1>Alameeere</h1>
      <h2>Movies</h2>
    </div>
    <div class="splash-hint">اضغط OK أو المس الشاشة للدخول</div>
  </div>

  <!-- Main App -->
  <div id="main-app" style="display:none;">
    <header>
      <div class="logo">
        <h1>Alameeere</h1>
        <h2>Movies</h2>
      </div>
      <form class="search-box" onsubmit="handleSearch(event)">
        <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل..." tabindex="0" />
        <button type="submit" tabindex="0">بحث</button>
      </form>
    </header>

    <nav class="categories" id="catList">
      <button class="cat-btn active" onclick="loadCategory('', this)">الكل</button>
    </nav>

    <main class="container">
      <div id="movieGrid" class="grid">جاري تحميل الأفلام...</div>
      <div class="pagination">
        <button id="prevBtn" onclick="changePage(-1)" disabled tabindex="0">السابق</button>
        <span id="pageNumber" style="align-self:center;">صفحة 1</span>
        <button id="nextBtn" onclick="changePage(1)" tabindex="0">التالي</button>
      </div>
    </main>
  </div>

  <!-- Player Modal -->
  <div class="modal" id="playerModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closePlayer()" tabindex="0">✕</button>
      <div class="video-wrapper" id="videoWrapper">
        <video id="videoPlayer" playsinline></video>
        <div id="playerLoader" class="player-loader">جاري التحميل...</div>
        <div class="custom-controls" id="customControls">
          <input type="range" id="progressBar" class="progress-bar" min="0" max="100" value="0" step="0.1" />
          <div class="controls-row">
            <button id="playPauseBtn" tabindex="0">⏸️</button>
            <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
            <div style="flex:1"></div>
            <button id="muteBtn" tabindex="0">🔊</button>
            <input type="range" id="volume-bar" min="0" max="1" step="0.1" value="1" />
            <select id="speedSelect" tabindex="0">
              <option value="0.5">0.5x</option>
              <option value="1" selected>1x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>
            <button id="fsBtn" tabindex="0">⛶</button>
          </div>
        </div>
      </div>
      <div class="video-title" id="playerTitle"></div>
    </div>
  </div>

  <script>
    const API = 'https://mo.m737217130.workers.dev/';
    let currentPage = 1;
    let currentCategory = '';
    let currentSearch = '';
    let hls = null;
    let hideControlsTimer;

    // ===== Splash =====
    const splash = document.getElementById('splash-screen');
    const mainApp = document.getElementById('main-app');

    function enterSite() {
      splash.style.opacity = '0';
      setTimeout(() => {
        splash.style.display = 'none';
        mainApp.style.display = 'block';
        fetchCategories();
        fetchMovies();
        // تركيز أول زر للريموت
        setTimeout(() => {
          const first = document.querySelector('.cat-btn');
          if (first) first.focus();
        }, 100);
      }, 600);
    }
    splash.addEventListener('click', enterSite);
    document.addEventListener('keydown', (e) => {
      if (splash.style.display !== 'none' && (e.key === 'Enter' || e.key === ' ')) {
        enterSite();
      }
    });

    // ===== Categories =====
    async function fetchCategories() {
      try {
        const res = await fetch(`${API}?action=categories`);
        const cats = await res.json();
        const container = document.getElementById('catList');
        const arr = Array.isArray(cats) ? cats : (cats.categories || cats.terms || []);
        arr.forEach(cat => {
          const btn = document.createElement('button');
          btn.className = 'cat-btn';
          btn.tabIndex = 0;
          btn.innerText = cat.name;
          btn.onclick = () => loadCategory(cat.slug, btn);
          container.appendChild(btn);
        });
      } catch (e) {
        console.error('خطأ في جلب التصنيفات:', e);
      }
    }

    // ===== Movies =====
    async function fetchMovies() {
      const grid = document.getElementById('movieGrid');
      grid.innerHTML = '<p>جاري التحميل...</p>';

      let url = `${API}?action=posts&page=${currentPage}`;
      if (currentSearch) {
        url = `${API}?action=search&search=${encodeURIComponent(currentSearch)}&page=${currentPage}`;
      } else if (currentCategory) {
        url = `${API}?action=posts&category=${currentCategory}&page=${currentPage}`;
      }

      try {
        const res = await fetch(url);
        const data = await res.json();
        grid.innerHTML = '';

        if (!data.posts || data.posts.length === 0) {
          grid.innerHTML = '<p>لا توجد نتائج لعرضها.</p>';
          return;
        }

        data.posts.forEach(post => {
          const card = document.createElement('div');
          card.className = 'card';
          card.tabIndex = 0;
          card.onclick = () => playMovie(post.realid, post.title);
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') playMovie(post.realid, post.title);
          });
          card.innerHTML = `
            <div class="poster-wrap">
              <img src="${post.thumbnail}" alt="${post.title}" loading="lazy" />
            </div>
            <h3>${post.title}</h3>
          `;
          grid.appendChild(card);
        });

        document.getElementById('pageNumber').innerText = `صفحة ${currentPage}`;
        document.getElementById('prevBtn').disabled = currentPage <= 1;
      } catch (e) {
        grid.innerHTML = '<p>حدث خطأ أثناء تحميل البيانات.</p>';
      }
    }

    // ===== Player =====
    const video = document.getElementById('videoPlayer');
    const modal = document.getElementById('playerModal');
    const loader = document.getElementById('playerLoader');
    const controls = document.getElementById('customControls');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const progressBar = document.getElementById('progressBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const muteBtn = document.getElementById('muteBtn');
    const volumeBar = document.getElementById('volume-bar');
    const speedSelect = document.getElementById('speedSelect');
    const fsBtn = document.getElementById('fsBtn');
    const videoWrapper = document.getElementById('videoWrapper');

    async function playMovie(realid, title) {
      document.getElementById('playerTitle').innerText = 'جاري تحضير سيرفر المشاهدة...';
      modal.classList.add('show');
      loader.style.display = 'block';

      try {
        const res = await fetch(`${API}?action=stream&realid=${realid}`);
        const streamData = await res.json();

        if (!streamData.url) {
          alert('تعذر استخراج رابط المشاهدة.');
          closePlayer();
          return;
        }

        document.getElementById('playerTitle').innerText = title;

        if (Hls.isSupported()) {
          if (hls) hls.destroy();
          hls = new Hls();
          hls.loadSource(streamData.url);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            loader.style.display = 'none';
            video.play().catch(() => {});
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = streamData.url;
          video.addEventListener('loadedmetadata', () => {
            loader.style.display = 'none';
            video.play().catch(() => {});
          }, { once: true });
        }
      } catch (e) {
        alert('حدث خطأ أثناء جلب الفيديو.');
        closePlayer();
      }
    }

    function closePlayer() {
      modal.classList.remove('show');
      video.pause();
      if (hls) { hls.destroy(); hls = null; }
    }

    // Play/Pause
    playPauseBtn.addEventListener('click', () => {
      video.paused ? video.play() : video.pause();
    });
    video.addEventListener('play', () => playPauseBtn.textContent = '⏸️');
    video.addEventListener('pause', () => playPauseBtn.textContent = '▶️');

    // Progress
    video.addEventListener('timeupdate', () => {
      if (!video.duration) return;
      progressBar.value = (video.currentTime / video.duration) * 100;
      timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
    });
    progressBar.addEventListener('input', () => {
      video.currentTime = (progressBar.value / 100) * video.duration;
    });

    // Volume / Mute
    muteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      muteBtn.textContent = video.muted ? '🔇' : '🔊';
    });
    volumeBar.addEventListener('input', () => {
      video.volume = volumeBar.value;
      video.muted = video.volume === 0;
      muteBtn.textContent = video.muted ? '🔇' : '🔊';
    });

    // Speed
    speedSelect.addEventListener('change', () => {
      video.playbackRate = parseFloat(speedSelect.value);
    });

    // Fullscreen
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) videoWrapper.requestFullscreen().catch(()=>{});
      else document.exitFullscreen();
    });

    function formatTime(sec) {
      if (isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    // إخفاء عناصر التحكم تلقائياً
    function showControls() {
      controls.classList.add('active');
      clearTimeout(hideControlsTimer);
      hideControlsTimer = setTimeout(() => {
        if (!video.paused) controls.classList.remove('active');
      }, 3000);
    }
    videoWrapper.addEventListener('mousemove', showControls);
    videoWrapper.addEventListener('touchstart', showControls);

    // ===== Pagination & Search =====
    function loadCategory(slug, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = slug;
      currentSearch = '';
      currentPage = 1;
      fetchMovies();
    }

    function handleSearch(e) {
      e.preventDefault();
      const val = document.getElementById('searchInput').value.trim();
      if (!val) return;
      currentSearch = val;
      currentCategory = '';
      currentPage = 1;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      fetchMovies();
    }

    function changePage(direction) {
      currentPage += direction;
      if (currentPage < 1) currentPage = 1;
      fetchMovies();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ===== Remote / D-Pad Spatial Navigation =====
    document.addEventListener('keydown', (e) => {
      // اختصارات داخل المشغل
      if (modal.classList.contains('show')) {
        showControls();
        if (e.key === 'ArrowRight') { video.currentTime += 10; e.preventDefault(); return; }
        if (e.key === 'ArrowLeft')  { video.currentTime -= 10; e.preventDefault(); return; }
        if (e.key === 'ArrowUp')    { video.volume = Math.min(video.volume + 0.1, 1); volumeBar.value = video.volume; e.preventDefault(); return; }
        if (e.key === 'ArrowDown')  { video.volume = Math.max(video.volume - 0.1, 0); volumeBar.value = video.volume; e.preventDefault(); return; }
        if (e.key === 'Escape' || e.key === 'Backspace') { closePlayer(); e.preventDefault(); return; }
        if (e.key === ' ' || e.key === 'Enter') {
          if (document.activeElement.tagName !== 'BUTTON' && document.activeElement.tagName !== 'SELECT' && document.activeElement.tagName !== 'INPUT') {
            video.paused ? video.play() : video.pause();
            e.preventDefault();
            return;
          }
        }
        return;
      }

      // التنقل بالأسهم في الصفحة الرئيسية
      const keys = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
      if (!keys.includes(e.key)) return;
      if (document.activeElement.tagName === "INPUT") return;

      const focusable = Array.from(document.querySelectorAll('button, [tabindex="0"]'))
        .filter(el => el.offsetWidth > 0 && el.offsetHeight > 0 && !el.disabled);
      if (focusable.length === 0) return;

      const current = document.activeElement;
      if (!current || !focusable.includes(current)) {
        focusable[0].focus();
        e.preventDefault();
        return;
      }

      e.preventDefault();
      const curRect = current.getBoundingClientRect();
      let best = null, minDist = Infinity;

      focusable.forEach(el => {
        if (el === current) return;
        const rect = el.getBoundingClientRect();
        const dx = (rect.left + rect.width/2) - (curRect.left + curRect.width/2);
        const dy = (rect.top + rect.height/2) - (curRect.top + curRect.height/2);
        let inDir = false, dist = Infinity;

        if (e.key === "ArrowRight" && dx > 10) { inDir = true; dist = Math.abs(dx) + Math.abs(dy)*2; }
        if (e.key === "ArrowLeft"  && dx < -10){ inDir = true; dist = Math.abs(dx) + Math.abs(dy)*2; }
        if (e.key === "ArrowDown"  && dy > 10) { inDir = true; dist = Math.abs(dy) + Math.abs(dx)*2; }
        if (e.key === "ArrowUp"    && dy < -10){ inDir = true; dist = Math.abs(dy) + Math.abs(dx)*2; }

        if (inDir && dist < minDist) { minDist = dist; best = el; }
      });

      if (best) {
        best.focus();
        best.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });

    // إخفاء مؤشر الماوس عند استخدام الريموت
    let mouseTimer;
    document.addEventListener('mousemove', () => {
      document.body.style.cursor = 'default';
      clearTimeout(mouseTimer);
      mouseTimer = setTimeout(() => document.body.style.cursor = 'none', 3000);
    });
  </script>
</body>
</html>
