<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AlameeereTv</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000000;color:#ffffff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit;border:0;background:none}

/* التركيز والتنقل بالريموت */
.f:focus,.f.sel{outline:3px solid #ffffff;outline-offset:2px;box-shadow:0 0 20px rgba(255,255,255,.45)}
.f{outline:none}

/* شاشة البداية الأصلية بدقة 100% مع سواد نقي */
#standby{
  position:fixed;
  inset:0;
  background:#000000;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:50;
  overflow:hidden;
  transition:opacity .5s ease;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
}
#standby.hide{opacity:0;pointer-events:none}

.logo{
  position:relative;
  font-size:clamp(38px,8.5vw,110px);
  font-weight:800;
  letter-spacing:.04em;
  color:#ffffff;
  direction:ltr;
  text-align:center;
  z-index:2;
}
.logo span{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%);
  background-size:250% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  mix-blend-mode:screen;
}
.logo .a{animation:sweepR 3.2s ease-in-out infinite}
.logo .b{animation:sweepL 3.2s ease-in-out infinite}
@keyframes sweepR{0%{background-position:150% 0}100%{background-position:-50% 0}}
@keyframes sweepL{0%{background-position:-50% 0}100%{background-position:150% 0}}

/* الخطين المنطلقين يلتقيان في المنتصف */
.beam{
  position:absolute;
  top:50%;
  height:2px;
  width:48vw;
  transform:translateY(-50%);
  filter:blur(1px);
  z-index:1;
}
.beam.r{
  background:linear-gradient(90deg,transparent,#ffffff);
  animation:beamR 3.2s ease-in-out infinite;
}
.beam.l{
  background:linear-gradient(270deg,transparent,#ffffff);
  animation:beamL 3.2s ease-in-out infinite;
}
@keyframes beamR{0%{right:100%}100%{right:-48vw}}
@keyframes beamL{0%{left:100%}100%{left:-48vw}}

/* الكرة المضيئة المتوهجة التي تنبض وتقترب وتبتعد */
.glow{
  position:absolute;
  width:44vw;
  height:44vw;
  min-width:180px;
  min-height:180px;
  max-width:320px;
  max-height:320px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.16) 0%,rgba(255,255,255,.07) 40%,transparent 70%);
  animation:pulse 3.2s ease-in-out infinite;
  z-index:1;
}
@keyframes pulse{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

.hint{
  position:absolute;
  bottom:8%;
  font-size:14px;
  color:#888888;
  letter-spacing:.08em;
  text-align:center;
  z-index:2;
}

/* رأس الصفحة المنظم بدقة: AlameeereTv -> 5 أيقونات -> السيرفر والبحث */
header{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:12px 14px 10px;
  background:#000000;
  border-bottom:1px solid #1a1a1a;
  flex-shrink:0;
}
.brand{
  font-weight:800;
  font-size:22px;
  direction:ltr;
  text-align:center;
  color:#ffffff;
  letter-spacing:.04em;
}

/* الصف الأول: خمس أيقونات */
.header-tabs{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:6px;
  width:100%;
}
.tab{
  padding:8px 2px;
  border-radius:999px;
  background:#111111;
  border:1px solid #222222;
  color:#bbb;
  font-size:13px;
  font-weight:600;
  text-align:center;
  cursor:pointer;
  white-space:nowrap;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all .2s;
}
.tab.on{
  background:#ffffff;
  color:#000000;
  border-color:#ffffff;
  font-weight:700;
}

/* الصف الثاني: السيرفر وخانة البحث */
.header-sub{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
}
.srv-btn{
  flex-shrink:0;
  padding:8px 16px;
  border-radius:999px;
  background:#161616;
  border:1px solid #2c2c2c;
  color:#38bdf8;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}
.search-box{
  position:relative;
  flex:1;
}
#search{
  width:100%;
  padding:8px 34px 8px 14px;
  border-radius:999px;
  background:#111111;
  border:1px solid #282828;
  color:#ffffff;
  font-size:13px;
  outline:none;
}
#search:focus{
  border-color:#555555;
  background:#181818;
}
.search-clear{
  position:absolute;
  left:10px;
  top:50%;
  transform:translateY(-50%);
  color:#888888;
  font-size:14px;
  background:none;
  border:0;
  cursor:pointer;
  display:none;
  padding:4px;
}

/* المحتوى الرئيسي */
main{
  display:flex;
  flex-direction:column;
  height:calc(100% - 134px);
  background:#000000;
  overflow:hidden;
}

/* صف المجموعات بالعرض تماماً (أفقي بالكامل) */
#cats{
  width:100%;
  height:48px;
  display:flex;
  flex-direction:row;
  align-items:center;
  overflow-x:auto;
  overflow-y:hidden;
  white-space:nowrap;
  gap:8px;
  padding:6px 12px;
  border-bottom:1px solid #1a1a1a;
  background:#000000;
  flex-shrink:0;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
#cats::-webkit-scrollbar{display:none}
.cat{
  display:inline-flex;
  align-items:center;
  padding:6px 14px;
  border-radius:999px;
  background:#111111;
  border:1px solid #222222;
  color:#bbb;
  font-size:13px;
  cursor:pointer;
  flex-shrink:0;
  transition:all .2s;
}
.cat.on{
  background:#ffffff;
  color:#000000;
  border-color:#ffffff;
  font-weight:700;
}

/* شبكة العرض بعرض الشاشة الكامل وبوسترات بنسبة ثابتة دون أي ضغط */
#grid{
  flex:1;
  overflow-y:auto;
  padding:12px;
  background:#000000;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(115px,1fr));
  gap:12px;
  align-content:start;
  -webkit-overflow-scrolling:touch;
}
.card{
  background:#0d0d0d;
  border-radius:10px;
  overflow:hidden;
  text-align:start;
  border:1px solid #1c1c1c;
  cursor:pointer;
}
.card img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#151515;
  display:block;
}
.card.live img{
  aspect-ratio:16/9;
  object-fit:contain;
  padding:10px;
  background:#0a0a0a;
}
.card p{
  padding:8px 10px;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#eee;
}
.msg{
  color:#888;
  padding:40px 16px;
  grid-column:1/-1;
  text-align:center;
  font-size:14px;
}

/* نمط بطاقات المباريات */
#grid.matches-mode{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  max-width:680px;
  margin:0 auto;
  width:100%;
}
@media(min-width:700px){
  #grid.matches-mode{
    grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
    max-width:100%;
  }
}

.match-card{
  background:#0f0f0f;
  border:1px solid #222222;
  border-radius:14px;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:12px;
  cursor:pointer;
  transition:border-color .2s;
}
.match-card:hover{border-color:#444}
.match-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #1a1a1a;
  padding-bottom:8px;
}
.match-tour{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:#aaa;
  font-weight:600;
}
.match-tour img{
  width:20px;
  height:20px;
  object-fit:contain;
}
.match-badge{
  font-size:11px;
  padding:3px 8px;
  border-radius:6px;
  background:#222;
  color:#aaa;
  font-weight:600;
}
.match-badge.live{
  background:rgba(239,68,68,.2);
  color:#ef4444;
  border:1px solid rgba(239,68,68,.3);
}
.match-body{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 0;
}
.team{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  width:38%;
  text-align:center;
}
.team img{
  width:44px;
  height:44px;
  object-fit:contain;
}
.team-name{
  font-size:13px;
  font-weight:600;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
}
.match-center{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  width:24%;
}
.score-box{
  font-size:18px;
  font-weight:800;
  color:#ffffff;
  letter-spacing:2px;
  background:#181818;
  padding:4px 10px;
  border-radius:8px;
  border:1px solid #282828;
}
.match-time{
  font-size:11px;
  color:#38bdf8;
  font-weight:600;
  white-space:nowrap;
}
.match-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-top:1px solid #1a1a1a;
  padding-top:10px;
  gap:8px;
}
.match-ch-box{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:#38bdf8;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  background:#141414;
  padding:6px 10px;
  border-radius:8px;
  border:1px solid #222;
}
.play-btn-sd{
  padding:7px 14px;
  border-radius:8px;
  background:#ffffff;
  color:#000000;
  font-size:12px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
  cursor:pointer;
}

/* نمط الأخبار */
#grid.news-mode{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  max-width:680px;
  margin:0 auto;
  width:100%;
}
@media(min-width:700px){
  #grid.news-mode{
    grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
    max-width:100%;
  }
}
.news-card{
  background:#0e0e0e;
  border:1px solid #1f1f1f;
  border-radius:12px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.news-thumb{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  background:#151515;
  display:block;
}
.news-content{
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.news-tour{
  font-size:11px;
  color:#38bdf8;
  font-weight:600;
}
.news-title{
  font-size:13px;
  font-weight:600;
  color:#ffffff;
  line-height:1.4;
}
.news-time{
  font-size:11px;
  color:#777;
}

/* المشغل */
#player{position:fixed;inset:0;background:#000000;z-index:40;display:none}
#player.open{display:block}
video{width:100%;height:100%;background:#000000}
#ctrl{position:absolute;inset:auto 0 0 0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.92));transition:opacity .3s;direction:ltr}
#player.idle #ctrl,#player.idle #ptitle{opacity:0}
#ptitle{position:absolute;top:0;inset-inline:0;padding:16px;background:linear-gradient(rgba(0,0,0,.85),transparent);font-size:16px;font-weight:700;transition:opacity .3s;direction:rtl}
#seek{width:100%;accent-color:#ffffff;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cb{padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.12);font-size:13px;min-width:44px;color:#fff;cursor:pointer}
.cb.accent{background:#38bdf8;color:#000;font-weight:700}
#vol{width:80px;accent-color:#ffffff}
#time{font-size:13px;color:#ccc;margin-inline-end:auto;font-variant-numeric:tabular-nums}
.menu{position:absolute;bottom:85px;right:16px;background:#111;border:1px solid #333;border-radius:10px;padding:6px;min-width:180px;max-height:50vh;overflow:auto;display:none;z-index:45}
.menu.open{display:block}
.menu h4{font-size:12px;color:#888;padding:6px 10px}
.mi{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;color:#eee;cursor:pointer}
.mi.on{background:#ffffff;color:#000000;font-weight:700}
#spin{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;background:rgba(0,0,0,.4)}
#spin.on{display:flex}
#spin div{width:48px;height:48px;border:3px solid #333;border-top-color:#ffffff;border-radius:50%;animation:rot 0.8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>

function getMatchChannelInfo(m){
  if(m.channel_commm && Array.isArray(m.channel_commm) && m.channel_commm.length > 0){
    const comm = m.channel_commm[0];
    const chName = typeof comm === 'string' ? comm : (comm.channel || comm.name || comm.channel_name || "");
    if(chName) return { name: chName, searchName: chName, id_sd: 569493, id_hd: 569493 };
  }
  const tour = (m.championship && m.championship.title) || "";
  if(tour.includes("إسباني")) return SPORTS_CHANNELS["bein1"];
  if(tour.includes("إنجليزي")) return SPORTS_CHANNELS["bein1"];
  if(tour.includes("فرنسي")) return SPORTS_CHANNELS["bein4"];
  if(tour.includes("ألماني")) return SPORTS_CHANNELS["bein5"];
  if(tour.includes("إيطالي")) return SPORTS_CHANNELS["adprem1"];
  if(tour.includes("أفريقيا") || tour.includes("كونفيدرالية")) return SPORTS_CHANNELS["bein6"];
  if(tour.includes("أدنوك") || tour.includes("إماراتي")) return SPORTS_CHANNELS["ad1"];
  if(tour.includes("تونس") || tour.includes("رابطة")) return SPORTS_CHANNELS["alkass1"];
  return SPORTS_CHANNELS["bein1"];
}

const $ = s => document.querySelector(s),
      grid = $("#grid"),
      cats = $("#cats"),

      sInput = $("#search"),
      sClear = $("#clearSearch");

const api = a => fetch(`${WORKER}/${server}/player_api.php?action=${a}`).then(r => r.json());
const img = u => u ? (u.startsWith("https") ? u : `${WORKER}/proxy?url=${encodeURIComponent(u)}`) : "";
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function norm(s){
  return String(s || "")
    .toLowerCase()
    .replace(/[أإآ]/g, "ا")
    .replace(/ة/g, "ه")
    .replace(/ى/g, "ي")
    .replace(/[ًٌٍَُِّْ]/g, "")
    .trim();
}

/* الدخول من شاشة البداية باللمس أو الضغط */
const sb = $("#standby");
function enter(){
  if(!sb || sb.classList.contains("hide")) return;
  sb.classList.add("hide");
  setTimeout(() => {
    sb.style.display = "none";
    const tab = $(".tab.on") || $(".tab");
    if(tab) tab.focus();
  }, 400);
}

if(sb){
  sb.addEventListener("click", enter);
  sb.addEventListener("touchstart", enter, {passive: true});
  sb.addEventListener("pointerdown", enter);
}
window.addEventListener("keydown", e => {
  if(sb && !sb.classList.contains("hide")) enter();
});

/* تبديل السيرفر */
$("#srv").onclick = () => {

  $("#srv").textContent = server === "s1" ? "سيرفر 1" : "سيرفر 2";

};

/* البحث السلس العام */
sInput.addEventListener("input", () => {
  sClear.style.display = sInput.value ? "block" : "none";
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(handleSearch, 120);
});
sClear.addEventListener("click", () => {
  sInput.value = "";
  sClear.style.display = "none";
  handleSearch();
  sInput.focus();
});

function handleSearch(){
  const q = sInput.value.trim();
  if(type === "matches"){
    const curCat = $(".cat.on") ? $(".cat.on").dataset.c : "all";
    renderMatches(curCat === "all" ? null : curCat, q);
    return;
  }
  if(type === "news"){
    renderNews(q);
    return;
  }
  if(q){
    loadGrid(cat, q);
  } else {
    loadGrid(cat, null);
  }
}

/* التحميل الأساسي */
function load(){
  if(type === "matches"){
    loadMatches();
    return;
  }
  if(type === "news"){
    loadNews();
    return;
  }
  cats.style.display = "flex";
  cats.innerHTML = "";
  grid.className = "";
  grid.innerHTML = '<div class="msg">جاري التحميل...</div>';

  const catAction = type === "live" ? "get_live_categories" : (type === "vod" ? "get_vod_categories" : "get_series_categories");
  api(catAction).then(c => {
    cats.innerHTML = `<button class="cat f on" data-c="all">الكل</button>` +
      c.map(x => `<button class="cat f" data-c="${esc(x.category_id)}">${esc(x.category_name)}</button>`).join("");
    cats.querySelectorAll(".cat").forEach(b => {
      b.onclick = () => {
        cats.querySelectorAll(".cat").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
        cat = b.dataset.c === "all" ? null : b.dataset.c;
        loadGrid(cat, sInput.value.trim() || null);
      };
    });
    loadGrid(null, sInput.value.trim() || null);
  }).catch(() => {
    grid.innerHTML = '<div class="msg">تعذر الاتصال بالسيرفر</div>';
  });
}

async function getAllItems(t){
  if(allCache[t]) return allCache[t];
  const action = t === "live" ? "get_live_streams" : (t === "vod" ? "get_vod_streams" : "get_series");
  const data = await api(action);
  allCache[t] = Array.isArray(data) ? data : [];
  return allCache[t];
}

async function loadGrid(c, query = null){
  grid.className = "";
  grid.innerHTML = '<div class="msg">جاري تحميل المحتوى...</div>';
  try {
    let items;
    if(query){
      const all = await getAllItems(type);
      const q = norm(query);
      items = all.filter(it => norm(it.name || it.title).includes(q));
      if(c) items = items.filter(it => String(it.category_id) === String(c));
    } else if(c){
      const action = type === "live" ? `get_live_streams&category_id=${c}` : (type === "vod" ? `get_vod_streams&category_id=${c}` : `get_series&category_id=${c}`);
      items = await api(action);
    } else {
      items = await getAllItems(type);
    }
    renderCards(items);
  } catch(e){
    grid.innerHTML = '<div class="msg">حدث خطأ في تحميل البيانات</div>';
  }
}

function renderCards(items){
  if(!items || !items.length){
    grid.innerHTML = '<div class="msg">لا يوجد محتوى متوفر</div>';
    return;
  }
  grid.innerHTML = items.slice(0, 300).map(it => {
    const id = it.stream_id || it.series_id;
    const name = it.name || it.title || "";
    const poster = it.stream_icon || it.cover || "";
    return `
      <div class="card f ${type === 'live' ? 'live' : ''}" tabindex="0" data-id="${esc(id)}">
        <img src="${img(poster)}" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 150\' fill=\'%23111\'/>'">
        <p>${esc(name)}</p>
      </div>`;
  }).join("");

  grid.querySelectorAll(".card").forEach(c => {
    c.onclick = () => playItem(c.dataset.id);
    c.onkeydown = e => { if(e.key === "Enter") playItem(c.dataset.id); };
  });
}

/* تبويب المباريات */
function loadMatches(){
  cats.style.display = "flex";
  const matches = MATCHES_DATA.data || [];
  const toursMap = {};
  matches.forEach(m => {
    if(m.championship && m.championship.title){
      toursMap[m.championship.title] = (toursMap[m.championship.title] || 0) + 1;
    }
  });

  cats.innerHTML = `<button class="cat f on" data-c="all">🏆 كل المباريات (${matches.length})</button>` +
    Object.keys(toursMap).map(t => `<button class="cat f" data-c="${esc(t)}">${esc(t)} (${toursMap[t]})</button>`).join("");

  cats.querySelectorAll(".cat").forEach(c => {
    c.onclick = () => {
      cats.querySelectorAll(".cat").forEach(x => x.classList.remove("on"));
      c.classList.add("on");
      renderMatches(c.dataset.c === "all" ? null : c.dataset.c, sInput.value.trim() || null);
    };
  });

  grid.className = "matches-mode";
  renderMatches(null, sInput.value.trim() || null);
}

function renderMatches(filterTour = null, filterQuery = null){
  let matches = MATCHES_DATA.data || [];
  if(filterTour){
    matches = matches.filter(m => m.championship && m.championship.title === filterTour);
  }
  if(filterQuery){
    const q = norm(filterQuery);
    matches = matches.filter(m => {
      const h = norm(m.home_team && m.home_team.title);
      const a = norm(m.away_team && m.away_team.title);
      const t = norm(m.championship && m.championship.title);
      return h.includes(q) || a.includes(q) || t.includes(q);
    });
  }

  if(!matches.length){
    grid.innerHTML = '<div class="msg">لا توجد مباريات مطابقة</div>';
    return;
  }

  grid.innerHTML = matches.map(m => {
    const isLive = m.live === 1;
    const isEnded = m.status === 4;
    const tourTitle = (m.championship && m.championship.title) || "مباراة";
    const tourImg = m.championship && m.championship.image ? `https://imgs.ysscores.com/championship/48/${m.championship.image}` : "";
    const homeTitle = (m.home_team && m.home_team.title) || "المضيف";
    const homeImg = m.home_team && m.home_team.image ? `https://imgs.ysscores.com/teams/128/${m.home_team.image}` : "";
    const awayTitle = (m.away_team && m.away_team.title) || "الضيف";
    const awayImg = m.away_team && m.away_team.image ? `https://imgs.ysscores.com/teams/128/${m.away_team.image}` : "";

    const hScore = m.home_scores !== null && m.home_scores !== undefined ? m.home_scores : "-";
    const aScore = m.away_scores !== null && m.away_scores !== undefined ? m.away_scores : "-";

    const badgeText = isLive ? "🔴 مباشر" : (isEnded ? "انتهت" : "قريباً");
    const badgeClass = isLive ? "match-badge live" : "match-badge";
    const timeText = isLive ? (m.score_time || "مباشر الآن") : (isEnded ? "انتهت اليوم" : `${(m.match_time || '').slice(0,5)} (مكة +3)`);

    const chInfo = getMatchChannelInfo(m);

    return `
      <div class="match-card f" tabindex="0" onclick="playMatch(${m.match_id})">
        <div class="match-header">
          <div class="match-tour">
            ${tourImg ? `<img src="${tourImg}" onerror="this.style.display='none'">` : ""}
            <span>${esc(tourTitle)}</span>
          </div>
          <span class="${badgeClass}">${badgeText}</span>
        </div>
        <div class="match-body">
          <div class="team">
            <img src="${homeImg}" onerror="this.src='https://imgs.ysscores.com/teams/64/${m.home_team && m.home_team.image || ''}';this.onerror=null;">
            <span class="team-name">${esc(homeTitle)}</span>
          </div>
          <div class="match-center">
            <div class="score-box">${hScore} - ${aScore}</div>
            <div class="match-time">${esc(timeText)}</div>
          </div>
          <div class="team">
            <img src="${awayImg}" onerror="this.src='https://imgs.ysscores.com/teams/64/${m.away_team && m.away_team.image || ''}';this.onerror=null;">
            <span class="team-name">${esc(awayTitle)}</span>
          </div>
        </div>
        <div class="match-footer">
          <div class="match-ch-box">📺 ${esc(chInfo.name)} (SD)</div>
          <div class="play-btn-sd">▶ تشغيل SD</div>
        </div>
      </div>
    `;
  }).join("");
}

/* تشغيل المباراة مع التوجيه لقناة SD أولاً ثم HD */
async function playMatch(matchId){
  const matches = MATCHES_DATA.data || [];
  const m = matches.find(x => x.match_id === matchId);
  if(!m) return;

  const chInfo = getMatchChannelInfo(m);
  const home = (m.home_team && m.home_team.title) || "";
  const away = (m.away_team && m.away_team.title) || "";
  $("#spin").classList.add("on");

  let liveList = allCache.live;
  if(!liveList){
    try {
      liveList = await api("get_live_streams");
      allCache.live = liveList;
    } catch(e){}
  }

  let selectedStream = null;
  let qualityTag = "SD";

  if(liveList && Array.isArray(liveList)){
    const baseKeyword = norm(chInfo.searchName || chInfo.name || "");
    // 1. فحص جودة SD أولاً
    const sdList = liveList.filter(c => {
      const n = norm(c.name);
      return n.includes(baseKeyword) && (n.includes("sd") || n.includes("low") || n.includes("ضعيف") || n.includes("480") || n.includes("360"));
    });
    if(sdList.length > 0){
      selectedStream = sdList[0];
      qualityTag = "SD";
    }
    // 2. إذا لم يجد SD، يبحث عن أي قناة مطابقة أو HD
    if(!selectedStream){
      const hdList = liveList.filter(c => norm(c.name).includes(baseKeyword));
      if(hdList.length > 0){
        selectedStream = hdList[0];
        qualityTag = "HD";
      }
    }
  }

  const streamId = selectedStream ? selectedStream.stream_id : (chInfo.id_sd || chInfo.id_hd || 569493);
  const chDisplayName = selectedStream ? selectedStream.name : `${chInfo.name} (${qualityTag})`;
  const title = `⚽ ${home} ضد ${away} - ${chDisplayName}`;
  const url = `${WORKER}/${server}/live/${streamId}.m3u8`;

  currentExternalUrl = url;
  $("#ptitle").textContent = title;
  P.classList.add("open");
  playStream(url, true);
}

/* تبويب الأخبار */
function loadNews(){
  cats.style.display = "none";
  grid.className = "news-mode";
  renderNews();
}

function renderNews(filterQuery = null){
  let news = NEWS_DATA || [];
  if(filterQuery){
    const q = norm(filterQuery);
    news = news.filter(n => norm(n.Title).includes(q) || norm(n.ChampionshipTitle).includes(q));
  }

  if(!news.length){
    grid.innerHTML = '<div class="msg">لا توجد أخبار مطابقة</div>';
    return;
  }

  grid.innerHTML = news.map(n => `
    <div class="news-card f" tabindex="0">
      <img class="news-thumb" src="${n.ImageUrl}" loading="lazy" onerror="this.src='${n.ImageThumbUrl}';this.onerror=null;">
      <div class="news-content">
        <span class="news-tour">${esc(n.ChampionshipTitle)}</span>
        <h3 class="news-title">${esc(n.Title)}</h3>
        <span class="news-time">📅 ${esc(n.DateNews)}</span>
      </div>
    </div>
  `).join("");
}

/* تشغيل الأفلام والمسلسلات */
async function playItem(id){
  $("#spin").classList.add("on");
  try {
    if(type === "live"){
      const all = allCache.live || await api("get_live_streams");
      const it = all.find(x => String(x.stream_id) === String(id)) || {};
      const url = `${WORKER}/${server}/live/${id}.m3u8`;
      currentExternalUrl = url;
      $("#ptitle").textContent = it.name || "بث مباشر";
      P.classList.add("open");
      playStream(url, true);
    } else if(type === "vod"){
      const all = allCache.vod || await api("get_vod_streams");
      const it = all.find(x => String(x.stream_id) === String(id)) || {};
      const ext = it.container_extension || "mp4";
      const directUrl = `${WORKER}/${server}/movie/${id}.${ext}`;
      const hlsUrl = `${WORKER}/${server}/movie/${id}.m3u8`;
      currentExternalUrl = directUrl;
      $("#ptitle").textContent = it.name || "فيلم";
      P.classList.add("open");
      if(server === "s2"){
        playStream(hlsUrl, false, directUrl);
      } else {
        playStream(directUrl, false);
      }
    } else if(type === "series"){
      const info = await api(`get_series_info&series_id=${id}`);
      const eps = info.episodes ? Object.values(info.episodes).flat() : [];
      if(!eps.length) throw new Error("no episodes");
      cats.style.display = "none";
      grid.innerHTML = eps.map(e => `
        <div class="card f" data-ep="${e.id}" data-ext="${e.container_extension||'mp4'}">
          <img src="${img(e.info && e.info.movie_image)}" onerror="this.style.display='none'">
          <p>الحلقة ${esc(e.episode_num)}: ${esc(e.title || '')}</p>
        </div>
      `).join("");
      grid.querySelectorAll(".card").forEach(c => {
        c.onclick = () => {
          const epUrl = `${WORKER}/${server}/series/${c.dataset.ep}.${c.dataset.ext}`;
          currentExternalUrl = epUrl;
          $("#ptitle").textContent = c.querySelector("p").textContent;
          P.classList.add("open");
          playStream(epUrl, false);
        };
      });
    }
  } catch(e){
    alert("تعذر تشغيل العنصر");
    P.classList.remove("open");
  } finally {
    $("#spin").classList.remove("on");
  }
}

/* مشغل الفيديو وتحسين سرعة البدء */
function playStream(url, isLive, fallbackUrl = null){
  if(hls){ hls.destroy(); hls = null; }
  $("#m-q").classList.remove("open");

  if(url.includes(".m3u8") && Hls.isSupported()){
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: true,
      backBufferLength: 30,
      maxBufferLength: 10,
      maxMaxBufferLength: 20,
      capLevelToPlayerSize: false,
      startLevel: 0
    });
    hls.loadSource(url);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, (ev, data) => {
      $("#spin").classList.remove("on");
      v.play().catch(() => {});
      renderMenu(data.levels);
    });
    hls.on(Hls.Events.ERROR, (ev, data) => {
      if(data.fatal){
        if(fallbackUrl){
          playStream(fallbackUrl, isLive);
        } else {
          $("#spin").classList.remove("on");
        }
      }
    });
  } else {
    v.src = url;
    v.play().then(() => {
      $("#spin").classList.remove("on");
    }).catch(() => {
      $("#spin").classList.remove("on");
    });
  }
}

function renderMenu(levels = []){
  const qList = $("#q-list");
  if(!levels || !levels.length){
    qList.innerHTML = '<div class="mi on">تلقائي (سريع)</div>';
    return;
  }
  let h = `<div class="mi ${hls.currentLevel === -1 ? 'on' : ''}" onclick="setLevel(-1)">تلقائي (الأسرع)</div>`;
  levels.forEach((l, i) => {
    const label = `${l.height || l.name || 'جودة'}p`;
    h += `<div class="mi ${hls.currentLevel === i ? 'on' : ''}" onclick="setLevel(${i})">${label}</div>`;
  });
  qList.innerHTML = h;
}

window.setLevel = i => {
  if(hls) hls.currentLevel = i;
  $("#m-q").classList.remove("open");
};

/* تحكم المشغل */
$("#b-back").onclick = closePlayer;
$("#b-play").onclick = () => v.paused ? v.play() : v.pause();
$("#vol").oninput = e => v.volume = e.target.value;
$("#b-q").onclick = () => $("#m-q").classList.toggle("open");
$("#b-ext").onclick = () => {
  if(currentExternalUrl) window.open(currentExternalUrl, "_blank");
};

function closePlayer(){
  v.pause();
  if(hls){ hls.destroy(); hls = null; }
  v.src = "";
  P.classList.remove("open");
  $("#spin").classList.remove("on");
  $("#m-q").classList.remove("open");
}

v.ontimeupdate = () => {
  if(!v.duration) return;
  $("#seek").value = (v.currentTime / v.duration) * 100;
  $("#time").textContent = `${fmt(v.currentTime)} / ${fmt(v.duration)}`;
};
$("#seek").oninput = e => {
  if(v.duration) v.currentTime = (e.target.value / 100) * v.duration;
};
const fmt = s => {
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
};

/* تشغيل التطبيق المبدئي */
load();
</script>
