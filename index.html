<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AlameeereTv</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#0a0c10;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.f:focus,.f.sel{outline:2px solid #fff;outline-offset:2px}
.f{outline:none}

/* Standby Screen */
#standby{position:fixed;inset:0;background:#05070a;display:flex;align-items:center;justify-content:center;z-index:50;overflow:hidden;transition:opacity .6s}
#standby.hide{opacity:0;pointer-events:none}
.standby-logo{position:relative;font-size:clamp(40px,9vw,110px);font-weight:900;letter-spacing:.04em;color:#fff;direction:ltr}
.standby-logo span{position:absolute;inset:0;background:linear-gradient(90deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;mix-blend-mode:screen}
.standby-logo .a{animation:sweepR 3.2s ease-in-out infinite}
.standby-logo .b{animation:sweepL 3.2s ease-in-out infinite}
@keyframes sweepR{0%{background-position:150% 0}100%{background-position:-50% 0}}
@keyframes sweepL{0%{background-position:-50% 0}100%{background-position:150% 0}}
.beam{position:absolute;top:50%;height:2px;width:45vw;transform:translateY(-50%);filter:blur(1px)}
.beam.r{background:linear-gradient(90deg,transparent,#fff);animation:beamR 3.2s ease-in-out infinite}
.beam.l{background:linear-gradient(270deg,transparent,#fff);animation:beamL 3.2s ease-in-out infinite}
@keyframes beamR{0%{right:100%}100%{right:-45vw}}
@keyframes beamL{0%{left:100%}100%{left:-45vw}}
.glow{position:absolute;width:40vw;height:40vw;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 60%);animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.hint{position:absolute;bottom:8%;font-size:14px;color:#888;letter-spacing:.1em}

/* Header & Centered Logo */
header{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:10px 14px;
  background:#0e1117;
  border-bottom:1px solid #1a1f2c;
  flex-shrink:0;
  gap:10px;
}

/* Centered Brand Container */
.brand-center{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  background:transparent !important;
  border:none !important;
  box-shadow:none !important;
  padding:2px 0;
}
.brand-ico{
  font-size:24px;
  line-height:1;
  display:inline-block;
}

/* AlameeereTv Text: Lighting STRICTLY INSIDE THE LETTERS ONLY */
.brand-text{
  font-size:26px;
  font-weight:900;
  letter-spacing:1px;
  direction:ltr;
  display:inline-block;
  line-height:1.1;
  background-clip:text !important;
  -webkit-background-clip:text !important;
  color:transparent !important;
  -webkit-text-fill-color:transparent !important;
  background-color:transparent !important;
  background-size:300% 300%;
  animation:logoLetterGlow 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

/* الإضاءة داخل حروف AlameeereTv فقط */
@keyframes logoLetterGlow {
  /* 1. إضاءة من خافتة إلى مشعة (0% - 15%) */
  0% {
    background-image: linear-gradient(#3a3e48, #3a3e48);
  }
  15% {
    background-image: linear-gradient(#ffffff, #ffffff);
  }

  /* 2. من مشعة إلى خافتة (15% - 30%) */
  30% {
    background-image: linear-gradient(#3a3e48, #3a3e48);
  }

  /* 3. إطفاء كامل لكلمة AlameeereTv (30% - 38%) */
  33%, 38% {
    background-image: linear-gradient(#101318, #101318);
  }

  /* 4. مسح ضوئي من بداية حرف A إلى نهاية الكلمة v بحركة معتدلة (39% - 60%) */
  39% {
    background-image: linear-gradient(90deg, #101318 0%, #101318 40%, #ffffff 50%, #101318 60%, #101318 100%);
    background-position: 100% 50%;
    background-size: 250% 100%;
  }
  59% {
    background-image: linear-gradient(90deg, #101318 0%, #101318 40%, #ffffff 50%, #101318 60%, #101318 100%);
    background-position: 0% 50%;
    background-size: 250% 100%;
  }

  /* 5. إطفاء (60% - 66%) */
  60%, 66% {
    background-image: linear-gradient(#101318, #101318);
    background-position: 0% 0%;
    background-size: 100% 100%;
  }

  /* 6. صعود الإضاءة من أسفل الكلمة بتموج مثل سكب الحليب داخل الكوب (67% - 92%) */
  67% {
    background-image: linear-gradient(0deg, #ffffff 0%, rgba(255,255,255,0.9) 15%, rgba(255,255,255,0.25) 28%, #101318 40%, #101318 100%);
    background-position: 50% 100%;
    background-size: 100% 300%;
  }
  80% {
    background-image: linear-gradient(0deg, #ffffff 0%, #ffffff 50%, rgba(255,255,255,0.7) 65%, #101318 78%, #101318 100%);
    background-position: 50% 50%;
    background-size: 100% 300%;
  }
  90% {
    background-image: linear-gradient(0deg, #ffffff 0%, #ffffff 100%);
    background-position: 50% 0%;
    background-size: 100% 300%;
  }

  /* 7. عودة سلسة للخفوت (92% - 100%) */
  96%, 100% {
    background-image: linear-gradient(#3a3e48, #3a3e48);
    background-position: 0% 0%;
    background-size: 100% 100%;
  }
}

/* Controls Bar (Tabs + Server + Search) */
.controls-bar{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  flex-wrap:wrap;
}

.tab{
  padding:7px 14px;
  border-radius:999px;
  background:#161b24;
  font-size:14px;
  color:#a5b0c2;
  border:1px solid #232a38;
  transition:all .2s;
  white-space:nowrap;
}
.tab:hover{background:#1f2633;color:#fff}
.tab.on{background:#fff;color:#000;font-weight:700;border-color:#fff}

.srv-btn{
  padding:7px 13px;
  border-radius:999px;
  background:#1a2130;
  font-size:13px;
  color:#38bdf8;
  border:1px solid #0284c7;
  white-space:nowrap;
  font-weight:600;
}
.srv-btn:hover{background:#0284c7;color:#fff}

.search-box{
  display:flex;
  align-items:center;
  position:relative;
  flex:1;
  max-width:260px;
  min-width:140px;
}
#search{
  width:100%;
  padding:7px 28px 7px 12px;
  border-radius:999px;
  background:#141822;
  border:1px solid #283042;
  color:#fff;
  font-size:13px;
  transition:all .2s;
  direction:rtl;
}
#search:focus{border-color:#38bdf8;background:#181e2b;outline:none}
.search-clear{
  position:absolute;
  left:8px;
  color:#888;
  font-size:14px;
  background:none;
  border:0;
  cursor:pointer;
  display:none;
  line-height:1;
  padding:4px;
}
.search-clear.on{display:block}

/* Main Layout */
main{display:flex;flex:1;min-height:0;min-width:0;overflow:hidden;width:100%}

/* Categories Sidebar */
#cats{
  width:230px;
  flex-shrink:0;
  overflow-y:auto;
  overflow-x:hidden;
  border-inline-end:1px solid #1a1f2c;
  padding:8px;
  background:#0c0f14;
  scrollbar-width:thin;
  scrollbar-color:#2a3244 transparent;
}
#cats::-webkit-scrollbar{width:5px}
#cats::-webkit-scrollbar-thumb{background:#2a3244;border-radius:3px}
.cat{
  display:block;
  width:100%;
  text-align:start;
  padding:9px 12px;
  border-radius:8px;
  font-size:13px;
  color:#9aa5b8;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:all .2s;
}
.cat:hover{background:#161c26;color:#fff}
.cat.on{background:#1f2838;color:#38bdf8;font-weight:700}

/* Grid & Cards Container */
#grid{
  flex:1;
  min-height:0;
  min-width:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:14px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  grid-auto-rows:max-content; /* يمنع انضغاط الصفوف مهما زاد عدد البوسترات */
  gap:14px;
  align-content:start;
  scrollbar-width:thin;
  scrollbar-color:#2a3244 transparent;
  -webkit-overflow-scrolling:touch;
}
#grid::-webkit-scrollbar{width:6px}
#grid::-webkit-scrollbar-thumb{background:#2a3244;border-radius:3px}

/* Standard Video/Channel Card */
.card{
  background:#10141c;
  border-radius:10px;
  overflow:hidden;
  text-align:start;
  display:flex;
  flex-direction:column;
  width:100%;
  min-height:fit-content;
  border:1px solid #1a2230;
  transition:transform .15s ease,border-color .15s ease;
  cursor:pointer;
  touch-action:manipulation;
}
.card:hover{transform:translateY(-2px);border-color:#38bdf8}
.card img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#141924;
  display:block;
}
.card.live img{
  aspect-ratio:16/9;
  object-fit:contain;
  padding:8px;
  background:#0c0f16;
}
.card p{
  padding:8px 10px;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin:0;
  line-height:1.3;
}

/* Matches Layout */
.match-card{
  grid-column: span 2;
  background:#121722;
  border:1px solid #1f2838;
  border-radius:12px;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  transition:all .2s;
}
@media(max-width:550px){.match-card{grid-column: 1 / -1}}
.match-card:hover{border-color:#38bdf8}
.match-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #1d2535;
  padding-bottom:8px;
  font-size:12px;
  color:#8c9bb3;
}
.match-tour{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:600;
  color:#cbd5e1;
}
.match-tour img{width:20px;height:20px;object-fit:contain}
.match-badge{
  padding:3px 8px;
  border-radius:6px;
  font-size:11px;
  font-weight:700;
  background:#1a2232;
  color:#94a3b8;
}
.match-badge.live{background:#ef4444;color:#fff;animation:pulseLive 1.5s infinite}
@keyframes pulseLive{0%,100%{opacity:1}50%{opacity:.7}}
.match-body{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:4px 0;
}
.team{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  flex:1;
  text-align:center;
}
.team img{
  width:44px;
  height:44px;
  object-fit:contain;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));
}
.team-name{
  font-size:13px;
  font-weight:600;
  color:#f1f5f9;
  max-width:110px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.score-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-width:70px;
  padding:0 8px;
}
.scores{
  font-size:22px;
  font-weight:900;
  color:#fff;
  letter-spacing:3px;
  direction:ltr;
}
.match-time{
  font-size:11px;
  color:#94a3b8;
  margin-top:2px;
}

/* News Layout (حماية كاملة من الانضغاط) */
.news-card{
  grid-column: span 2;
  background:#11151f;
  border:1px solid #1e2637;
  border-radius:12px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  transition:all .2s;
}
@media(max-width:550px){.news-card{grid-column: 1 / -1}}
.news-card:hover{border-color:#38bdf8;transform:translateY(-2px)}
.news-thumb{
  width:100%;
  aspect-ratio:16/9;
  min-height:140px;
  background:#0c0f16;
  position:relative;
  overflow:hidden;
}
.news-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.news-tour-tag{
  position:absolute;
  top:8px;
  right:8px;
  background:rgba(10,13,20,.85);
  backdrop-filter:blur(4px);
  color:#38bdf8;
  padding:3px 8px;
  border-radius:6px;
  font-size:11px;
  font-weight:700;
  border:1px solid rgba(56,189,248,.3);
}
.news-content{
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
  flex:1;
}
.news-title{
  font-size:14px;
  font-weight:700;
  color:#f8fafc;
  line-height:1.45;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.news-date{
  font-size:11px;
  color:#8292a8;
  margin-top:auto;
}

.msg{color:#8896ab;padding:40px;grid-column:1/-1;text-align:center;font-size:14px}

@media(max-width:768px){
  header{padding:8px 10px;gap:8px}
  .brand-text{font-size:22px}
  .search-box{max-width:100%;width:100%;order:6;margin-top:2px}
  #search{font-size:13px;padding:6px 28px 6px 10px}
  main{flex-direction:column}
  #cats{width:100%;height:auto;max-height:48px;display:flex;overflow-x:auto;overflow-y:hidden;border:0;border-bottom:1px solid #1a1f2c;padding:5px 8px;gap:6px;-webkit-overflow-scrolling:touch}
  .cat{width:auto;flex-shrink:0;padding:5px 12px;font-size:12px}
  #grid{padding:10px;gap:10px;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));grid-auto-rows:max-content}
}

/* Player Overlay */
#player{position:fixed;inset:0;background:#000;z-index:40;display:none}
#player.open{display:block}
video{width:100%;height:100%;background:#000}
#ctrl{position:absolute;inset:auto 0 0 0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.92));transition:opacity .3s;direction:ltr}
#player.idle #ctrl,#player.idle #ptitle{opacity:0;pointer-events:none}
#ptitle{position:absolute;top:0;inset-inline:0;padding:16px;background:linear-gradient(rgba(0,0,0,.85),transparent);font-size:18px;transition:opacity .3s;direction:rtl;pointer-events:none}
#seek{width:100%;accent-color:#38bdf8;margin-bottom:10px;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cb{padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.1);font-size:14px;min-width:44px;display:flex;align-items:center;justify-content:center}
.cb:hover{background:rgba(255,255,255,.2)}
#vol{width:90px;accent-color:#38bdf8;cursor:pointer}
#time{font-size:13px;color:#ccc;margin-inline-end:auto;font-variant-numeric:tabular-nums}
.menu{position:absolute;bottom:90px;right:16px;background:#111;border:1px solid #333;border-radius:10px;padding:6px;min-width:180px;max-height:50vh;overflow:auto;display:none;z-index:45}
.menu.open{display:block}
.menu h4{font-size:12px;color:#888;padding:6px 10px}
.mi{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:6px;font-size:14px}
.mi.on{background:#38bdf8;color:#000;font-weight:700}
#spin{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
#spin.on{display:flex}
#spin div{width:48px;height:48px;border:3px solid #333;border-top-color:#38bdf8;border-radius:50%;animation:rot 0.8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>

/* Pre-fetch all items for instant universal search */
async function getAllItems(t){
  if(allCache[t])return allCache[t];
  const a={live:"get_live_streams",vod:"get_vod_streams",series:"get_series"}[t];
  if(!a) return null;
  try{
    const list=await api(a);
    if(Array.isArray(list)){allCache[t]=list;return list}
  }catch(e){}
  return null;
}

/* Load Matches Tab */
function loadMatches(){
  cats.style.display="block";
  const matches = MATCHES_DATA.data || [];
  
  // استخراج البطولات للتصنيف
  const toursMap = new Map();
  matches.forEach(m => {
    if(m.championship && m.championship.title){
      toursMap.set(m.championship.title, (toursMap.get(m.championship.title) || 0) + 1);
    }
  });

  cats.innerHTML = `<button class="cat f on" data-c="all">🏆 كل المباريات (${matches.length})</button>` +
    Array.from(toursMap.entries()).map(([tour, count]) => 
      `<button class="cat f" data-tour="${esc(tour)}">⚽ ${esc(tour)} (${count})</button>`
    ).join("");

  cats.querySelectorAll(".cat").forEach(b => {
    b.onclick = () => {
      cats.querySelectorAll(".cat").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      renderMatches(b.dataset.tour);
    };
  });

  renderMatches();
}

function renderMatches(filterTour = null, filterQuery = null){
  let matches = MATCHES_DATA.data || [];
  if(filterTour){
    matches = matches.filter(m => m.championship && m.championship.title === filterTour);
  }
  if(filterQuery){
    const q = norm(filterQuery);
    matches = matches.filter(m => {
      const h = norm(m.home_team && m.home_team.title);
      const a = norm(m.away_team && m.away_team.title);
      const t = norm(m.championship && m.championship.title);
      return h.includes(q) || a.includes(q) || t.includes(q);
    });
  }

  if(!matches.length){
    grid.innerHTML = `<div class="msg">لا توجد مباريات مطابقة</div>`;
    return;
  }

  grid.innerHTML = matches.map(m => {
    const isLive = m.live === 1;
    const isEnded = m.status === 4;
    const tourTitle = (m.championship && m.championship.title) || "مباراة";
    const tourImg = m.championship && m.championship.image ? `https://imgs.ysscores.com/championship/48/${m.championship.image}` : "";
    const homeTitle = (m.home_team && m.home_team.title) || "المضيف";
    const homeImg = m.home_team && m.home_team.image ? `https://imgs.ysscores.com/teams/128/${m.home_team.image}` : "";
    const awayTitle = (m.away_team && m.away_team.title) || "الضيف";
    const awayImg = m.away_team && m.away_team.image ? `https://imgs.ysscores.com/teams/128/${m.away_team.image}` : "";

    const hScore = m.home_scores !== null && m.home_scores !== undefined ? m.home_scores : "-";
    const aScore = m.away_scores !== null && m.away_scores !== undefined ? m.away_scores : "-";

    let badgeText = isLive ? "🔴 مباشر" : (isEnded ? "انتهت" : "قريباً");
    let badgeClass = isLive ? "match-badge live" : "match-badge";

    return `
      <div class="match-card">
        <div class="match-header">
          <div class="match-tour">
            ${tourImg ? `<img src="${tourImg}" onerror="this.style.display='none'">` : ""}
            <span>${esc(tourTitle)}</span>
          </div>
          <span class="${badgeClass}">${badgeText}</span>
        </div>
        <div class="match-body">
          <div class="team">
            <img src="${homeImg}" onerror="this.src='https://imgs.ysscores.com/teams/64/${m.home_team && m.home_team.image || ''}';this.onerror=null;">
            <span class="team-name" title="${esc(homeTitle)}">${esc(homeTitle)}</span>
          </div>
          <div class="score-box">
            <div class="scores">${hScore} - ${aScore}</div>
            <div class="match-time">🕒 ${m.match_time ? m.match_time.slice(0,5) : ""}</div>
          </div>
          <div class="team">
            <img src="${awayImg}" onerror="this.src='https://imgs.ysscores.com/teams/64/${m.away_team && m.away_team.image || ''}';this.onerror=null;">
            <span class="team-name" title="${esc(awayTitle)}">${esc(awayTitle)}</span>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

/* Load News Tab */
function loadNews(){
  cats.style.display="none";
  renderNews();
}

function renderNews(filterQuery = null){
  let news = NEWS_DATA || [];
  if(filterQuery){
    const q = norm(filterQuery);
    news = news.filter(n => norm(n.Title).includes(q) || (n.Tour && norm(n.Tour.Name).includes(q)));
  }

  if(!news.length){
    grid.innerHTML = `<div class="msg">لا توجد أخبار مطابقة</div>`;
    return;
  }

  grid.innerHTML = news.map(n => {
    const thumb = (n.Picture && (n.Picture.ArabiaLargePath || n.Picture.SmallPath)) || "";
    const tourName = (n.Tour && n.Tour.Name) || "أخبار الرياضة";
    const dateFormatted = n.Date ? n.Date.replace("T", " ").slice(0, 16) : "";

    return `
      <div class="news-card">
        <div class="news-thumb">
          <img src="${thumb}" onerror="this.src='https://mediayk.gemini.media/img/yallakora/tourlogo/EPLLogo19-9-2023-16-31-21.png';this.onerror=null;" loading="lazy">
          <span class="news-tour-tag">${esc(tourName)}</span>
        </div>
        <div class="news-content">
          <div class="news-title">${esc(n.Title)}</div>
          <div class="news-date">🕒 ${dateFormatted}</div>
        </div>
      </div>
    `;
  }).join("");
}

/* IPTV Load Categories & Streams */
async function load(){
  cats.style.display="block";
  cats.innerHTML='<div class="msg">تحميل...</div>';
  grid.innerHTML='<div class="msg">تحميل...</div>';
  try{
    const cs=await api({live:"get_live_categories",vod:"get_vod_categories",series:"get_series_categories"}[type]);
    cats.innerHTML=`<button class="cat f on" data-c="all">★ الكل</button>`+cs.map(c=>`<button class="cat f" data-c="${c.category_id}">${esc(c.category_name)}</button>`).join("");
    cats.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{
      cats.querySelectorAll(".cat").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      cat=b.dataset.c;
      loadGrid();
    });
    cat="all";
    loadGrid();
  }catch(e){
    cats.innerHTML='<div class="msg">خطأ اتصال</div>';
    grid.innerHTML='<div class="msg">تعذر جلب البيانات</div>';
  }
}

async function loadGrid(){
  grid.innerHTML='<div class="msg">تحميل...</div>';
  try{
    const a={live:"get_live_streams",vod:"get_vod_streams",series:"get_series"}[type];
    const u=cat==="all"?a:`${a}&category_id=${cat}`;
    const list=await api(u);
    currentList=Array.isArray(list)?list:[];
    renderCards(currentList);
  }catch(e){
    grid.innerHTML='<div class="msg">فشل التحميل</div>';
  }
}

function renderCards(list){
  if(!list||!list.length){grid.innerHTML='<div class="msg">لا يوجد محتوى</div>';return}
  grid.innerHTML=list.map(it=>{
    const id=it.stream_id||it.series_id;
    const name=it.name||it.title;
    const icon=it.stream_icon||it.cover;
    const isLive=type==="live";
    return `<div class="card f ${isLive?'live':''}" data-id="${id}" data-name="${esc(name)}">
      <img src="${img(icon)}" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'160\' height=\'100\' fill=\'%23222\'><rect width=\'100%\' height=\'100%\'/><text x=\'50%\' y=\'50%\' fill=\'%23666\' font-size=\'14\' text-anchor=\'middle\' dy=\'.3em\'>📺</text></svg>';" loading="lazy">
      <p>${esc(name)}</p>
    </div>`;
  }).join("");

  grid.querySelectorAll(".card").forEach(c=>c.onclick=()=>playItem(c.dataset.id,c.dataset.name));
}

/* Universal Fast Search */
function handleSearch(q){
  q=norm(q);
  if(q){sClear.classList.add("on")}else{sClear.classList.remove("on")}
  
  if(type === "matches"){
    renderMatches(null, q);
    return;
  }
  if(type === "news"){
    renderNews(q);
    return;
  }

  if(!q){
    renderCards(currentList);
    return;
  }

  const pool = allCache[type] || currentList;
  const filtered = pool.filter(it => norm(it.name || it.title).includes(q));
  renderCards(filtered);

  if(!allCache[type]){
    getAllItems(type).then(fullList => {
      if(fullList && sInput.value.trim()){
        const qNow = norm(sInput.value);
        renderCards(fullList.filter(it => norm(it.name || it.title).includes(qNow)));
      }
    });
  }
}

sInput.addEventListener("input",e=>{
  clearTimeout(searchT);
  searchT=setTimeout(()=>handleSearch(e.target.value),120);
});

sClear.onclick=()=>{
  sInput.value="";
  handleSearch("");
  sInput.focus();
};

/* Video Player */
async function playItem(id,title){
  if(type==="series"){
    stack.push({cat,list:currentList});
    try{
      const info=await api(`get_series_info&series_id=${id}`);
      const eps=[];
      Object.keys(info.episodes||{}).forEach(s=>{
        (info.episodes[s]||[]).forEach(e=>{
          eps.push({stream_id:e.id,name:`م${s}:ح${e.episode_num} - ${e.title||''}`,stream_icon:e.info&&e.info.movie_image});
        });
      });
      type="series_episodes";
      cats.innerHTML='<button class="cat f on" id="bBack">↩ رجوع للمسلسلات</button>';
      $("#bBack").onclick=()=>{type="series";const p=stack.pop();currentList=p.list;renderCards(currentList);load()};
      renderCards(eps);
    }catch(e){alert("تعذر جلب الحلقات")}
    return;
  }

  const isLive=type==="live";
  const ext=isLive?"m3u8":"mp4";
  const sub=isLive?"live":(type==="series_episodes"?"series":"movie");
  const url=`${WORKER}/${server}/${sub}/${id}.${ext}`;
  currentExternalUrl=url;

  $("#ptitle").textContent=title;
  P.classList.add("open");
  playStream(url,isLive);
}

function playStream(url,isLive){
  if(hls){hls.destroy();hls=null}
  $("#spin").classList.add("on");

  if(Hls.isSupported()){
    hls=new Hls({
      startLevel: 0,
      capLevelToPlayerSize: true,
      maxBufferLength: 10,
      maxMaxBufferLength: 20
    });
    hls.loadSource(url);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{$("#spin").classList.remove("on");v.play().catch(()=>{})});
    hls.on(Hls.Events.ERROR,(e,d)=>{
      if(d.fatal){
        if(d.type===Hls.ErrorTypes.NETWORK_ERROR){hls.startLoad()}
        else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){hls.recoverMediaError()}
        else{hls.destroy();v.src=url;v.play().catch(()=>{})}
      }
    });
  }else if(v.canPlayType("application/vnd.apple.mpegurl")){
    v.src=url;
    v.addEventListener("loadedmetadata",()=>{$("#spin").classList.remove("on");v.play().catch(()=>{})},{once:true});
  }else{
    v.src=url;
    v.play().catch(()=>{});
  }
}

  if(!v.duration)return;
  $("#seek").value=(v.currentTime/v.duration)*1000;
  const m=Math.floor(v.currentTime/60),s=Math.floor(v.currentTime%60);
  $("#time").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
};
$("#bExt").onclick=()=>{if(currentExternalUrl)window.open(currentExternalUrl,"_blank")};
$("#bFs").onclick=()=>{
  if(!document.fullscreenElement){P.requestFullscreen().catch(()=>{})}
  else{document.exitFullscreen().catch(()=>{})}
};
$("#bX").onclick=closePlayer;

function closePlayer(){
  v.pause();
  v.removeAttribute("src");
  v.load();
  if(hls){hls.destroy();hls=null}
  P.classList.remove("open");
}

let idleT=null;
function bump(){
  P.classList.remove("idle");
  clearTimeout(idleT);
  idleT=setTimeout(()=>P.classList.add("idle"),3500);
}
["mousemove","touchstart","click","keydown"].forEach(ev=>document.addEventListener(ev,bump));

/* Initial Start */
load();
getAllItems("live");
</script>
</body>
</html>
