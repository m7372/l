<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>AlameeereTv</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000000;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden;user-select:none}
button,input{font:inherit;color:inherit;border:0;background:none}

/* Focus rings for Smart TV / Keyboard */
.f:focus,.f.sel{outline:2px solid #ffffff;outline-offset:2px;box-shadow:0 0 12px rgba(255,255,255,0.4)}
.f{outline:none}

/* Standby / Splash Screen */
#standby{
  position:fixed;
  inset:0;
  background:#000000;
  z-index:50;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:opacity .4s ease;
}
#standby.hide{opacity:0;pointer-events:none}
.glow{
  position:absolute;
  width:50vw;
  height:50vw;
  max-width:400px;
  max-height:400px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.12) 0%,transparent 70%);
  animation:pulse 3.2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.25);opacity:1}}

.beam{position:absolute;top:50%;height:2px;width:45vw;transform:translateY(-50%);filter:blur(1px)}
.beam.r{background:linear-gradient(90deg,transparent,#ffffff);animation:beamR 3.2s ease-in-out infinite}
.beam.l{background:linear-gradient(270deg,transparent,#ffffff);animation:beamL 3.2s ease-in-out infinite}
@keyframes beamR{0%{right:100%}100%{right:-45vw}}
@keyframes beamL{0%{left:100%}100%{left:-45vw}}

.logo{
  position:relative;
  font-size:clamp(36px,8vw,110px);
  font-weight:800;
  letter-spacing:.04em;
  color:#ffffff;
  direction:ltr;
}
.logo span{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  background-size:200% 100%;
}
.logo .a{animation:sweepR 3.2s ease-in-out infinite}
.logo .b{animation:sweepL 3.2s ease-in-out infinite}
@keyframes sweepR{0%{background-position:150% 0}100%{background-position:-50% 0}}
@keyframes sweepL{0%{background-position:-50% 0}100%{background-position:150% 0}}

.hint{
  position:absolute;
  bottom:40px;
  font-size:14px;
  color:#888888;
  letter-spacing:1px;
}

/* Main App Layout */
header{
  background:#050505;
  border-bottom:1px solid #1a1a1a;
  padding:8px 12px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* Top Row: Date | Animated Logo | Clock */
.top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  gap:8px;
}
.header-widget{
  font-size:12px;
  color:#aaaaaa;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  flex:1;
  display:flex;
  align-items:center;
}
.header-widget.date{justify-content:flex-start}
.header-widget.time{justify-content:flex-end;color:#4ade80;font-weight:600}

.brand-wrap{
  position:relative;
  display:inline-block;
  text-align:center;
}
.brand-logo{
  position:relative;
  font-size:clamp(20px, 4.5vw, 26px);
  font-weight:800;
  letter-spacing:.04em;
  color:#ffffff;
  direction:ltr;
  display:inline-block;
  user-select:none;
}
.brand-logo .sweep{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg, transparent 35%, rgba(255,255,255,0.98) 50%, transparent 65%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  background-size:200% 100%;
  pointer-events:none;
}
.brand-logo .sweep.a{animation:sweepR 3.2s ease-in-out infinite}
.brand-logo .sweep.b{animation:sweepL 3.2s ease-in-out infinite}

/* 5 Main Navigation Tabs in 1 Row */
.header-tabs{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:6px;
  width:100%;
}
.tab{
  padding:7px 4px;
  font-size:12px;
  border-radius:999px;
  background:#141414;
  color:#bbbbbb;
  text-align:center;
  white-space:nowrap;
  cursor:pointer;
  border:1px solid #222222;
  transition:all .15s ease;
  overflow:hidden;
  text-overflow:ellipsis;
}
.tab:hover{background:#1f1f1f;color:#ffffff}
.tab.on{
  background:#ffffff;
  color:#000000;
  font-weight:700;
  border-color:#ffffff;
}

/* Server & Search Bar Row */
.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
}
#srv{
  padding:7px 14px;
  font-size:12px;
  font-weight:600;
  border-radius:999px;
  background:#161616;
  color:#60a5fa;
  border:1px solid #252525;
  white-space:nowrap;
  cursor:pointer;
}
#srv:hover{background:#202020}
.search-box{
  position:relative;
  flex:1;
  display:flex;
  align-items:center;
}
#search{
  width:100%;
  padding:7px 32px 7px 12px;
  background:#121212;
  border:1px solid #252525;
  border-radius:999px;
  font-size:12px;
  color:#ffffff;
}
#search:focus{border-color:#444444;background:#181818}
.search-clear{
  position:absolute;
  left:10px;
  width:20px;
  height:20px;
  display:none;
  align-items:center;
  justify-content:center;
  color:#888888;
  cursor:pointer;
  font-size:12px;
}
.search-clear:hover{color:#ffffff}

/* Main Container */
main{
  display:flex;
  flex-direction:column;
  height:calc(100% - 138px);
  background:#000000;
  overflow:hidden;
}

/* Categories Bar (Horizontal Scrolling) */
#cats{
  width:100%;
  min-height:44px;
  max-height:44px;
  display:flex;
  align-items:center;
  overflow-x:auto;
  overflow-y:hidden;
  border-bottom:1px solid #141414;
  padding:4px 10px;
  gap:6px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  flex-shrink:0;
}
#cats::-webkit-scrollbar{display:none}
.cat{
  flex-shrink:0;
  padding:5px 12px;
  border-radius:999px;
  font-size:12px;
  background:#121212;
  color:#aaaaaa;
  cursor:pointer;
  border:1px solid #222222;
  white-space:nowrap;
  transition:all .15s ease;
}
.cat:hover{background:#1c1c1c;color:#ffffff}
.cat.on{
  background:#ffffff;
  color:#000000;
  font-weight:700;
  border-color:#ffffff;
}

/* Grid & Cards */
#grid{
  flex:1;
  min-height:0;
  min-width:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:12px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  grid-auto-rows:max-content;
  gap:12px;
  align-content:start;
  scrollbar-width:thin;
  scrollbar-color:#2a2a2a transparent;
  -webkit-overflow-scrolling:touch;
  background:#000000;
}
#grid.live-mode{
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
}
#grid::-webkit-scrollbar{width:6px}
#grid::-webkit-scrollbar-thumb{background:#222222;border-radius:3px}

/* Poster Cards */
.card{
  background:#0d0d0d;
  border-radius:10px;
  overflow:hidden;
  text-align:start;
  display:flex;
  flex-direction:column;
  width:100%;
  height:auto;
  min-height:fit-content;
  border:1px solid #1c1c1c;
  transition:transform .15s ease,border-color .15s ease;
  cursor:pointer;
  touch-action:manipulation;
}
.card:hover{transform:translateY(-2px);border-color:#383838}

.card img{
  width:100%;
  max-width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#151515;
  display:block;
  min-height:120px;
  flex-shrink:0;
}
.card.live img{
  aspect-ratio:16/9;
  object-fit:contain;
  padding:8px;
  background:#0a0a0a;
  min-height:75px;
}
.card p{
  padding:8px 10px;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin:0;
  line-height:1.3;
  color:#e0e0e0;
  flex-shrink:0;
}
.msg{color:#777777;padding:30px;grid-column:1/-1;text-align:center;font-size:14px}

/* Matches Mode */
#grid.matches-mode{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}
@media(min-width:650px){
  #grid.matches-mode{
    grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  }
}
.match-card{
  background:#0d0d0d;
  border:1px solid #1e1e1e;
  border-radius:12px;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.match-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #181818;
  padding-bottom:6px;
  font-size:11px;
  color:#888888;
}
.match-badge-live{
  background:#ef4444;
  color:#ffffff;
  padding:2px 8px;
  border-radius:6px;
  font-weight:700;
  font-size:10px;
  display:flex;
  align-items:center;
  gap:4px;
}
.match-badge-wait{
  background:#1e1e1e;
  color:#aaaaaa;
  padding:2px 8px;
  border-radius:6px;
  font-size:10px;
}
.match-body{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:4px 0;
}
.team-side{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  width:38%;
  text-align:center;
}
.team-side img{
  width:42px;
  height:42px;
  object-fit:contain;
}
.team-side span{
  font-size:12px;
  font-weight:600;
  line-height:1.2;
}
.match-center{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  width:24%;
}
.match-score{
  background:#181818;
  padding:4px 10px;
  border-radius:8px;
  font-size:16px;
  font-weight:800;
  letter-spacing:2px;
  font-variant-numeric:tabular-nums;
}
.match-time-tag{
  font-size:10px;
  color:#60a5fa;
  direction:ltr;
}
.match-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-top:1px solid #181818;
  padding-top:8px;
  gap:8px;
}
.btn-watch{
  padding:6px 12px;
  background:#ffffff;
  color:#000000;
  font-size:11px;
  font-weight:700;
  border-radius:6px;
  cursor:pointer;
}
.btn-channel{
  font-size:11px;
  color:#60a5fa;
  background:#141414;
  padding:5px 8px;
  border-radius:6px;
  border:1px solid #222222;
}

/* News Mode */
#grid.news-mode{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}
@media(min-width:650px){
  #grid.news-mode{
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  }
}
.news-card{
  background:#0d0d0d;
  border:1px solid #1c1c1c;
  border-radius:10px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.news-card img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  background:#141414;
}
.news-body{padding:10px}
.news-body h3{font-size:13px;line-height:1.4;margin-bottom:6px}
.news-body .meta{font-size:10px;color:#777777;display:flex;justify-content:space-between}

/* Responsive Adjustments for Mobile */
@media(max-width:768px){
  header{padding:6px 8px;gap:6px}
  main{height:calc(100% - 128px)}
  #grid{padding:8px;gap:8px;grid-template-columns:repeat(auto-fill,minmax(105px,1fr))}
  #grid.live-mode{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .card img{min-height:100px}
  .card.live img{min-height:65px}
}

/* Player */
#player{position:fixed;inset:0;background:#000000;z-index:100;display:none}
#player.open{display:block}
video{width:100%;height:100%;background:#000000}
#ctrl{position:absolute;inset:auto 0 0 0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.92));transition:opacity .3s;direction:ltr}
#player.idle #ctrl,#player.idle #ptitle{opacity:0;pointer-events:none}
#ptitle{position:absolute;top:0;inset-inline:0;padding:16px;background:linear-gradient(rgba(0,0,0,.85),transparent);font-size:16px;transition:opacity .3s;direction:rtl;pointer-events:none}
#seek{width:100%;accent-color:#ffffff;margin-bottom:10px;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cb{padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.1);font-size:13px;min-width:44px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cb:hover{background:rgba(255,255,255,.2)}
#vol{width:80px;accent-color:#ffffff;cursor:pointer}
#time{font-size:13px;color:#cccccc;margin-inline-end:auto;font-variant-numeric:tabular-nums}
.menu{position:absolute;bottom:90px;right:16px;background:#111111;border:1px solid #333333;border-radius:10px;padding:6px;min-width:180px;max-height:50vh;overflow:auto;display:none;z-index:105}
.menu.open{display:block}
.menu h4{font-size:12px;color:#888888;padding:6px 10px}
.mi{display:block;width:100%;text-align:right;padding:8px 10px;border-radius:6px;font-size:13px;cursor:pointer}
.mi:hover{background:#222222}
.mi.on{background:#ffffff;color:#000000}
#spin{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
#spin.on{display:flex}
#spin div{width:48px;height:48px;border:3px solid #333333;border-top-color:#ffffff;border-radius:50%;animation:rot 0.8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>

/* Live Date & Clock Widget */
function updateDateTime(){
  const now = new Date();
  const dateStr = now.toLocaleDateString("ar-SA", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
  });
  const timeStr = now.toLocaleTimeString("ar-SA", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: true
  });
  const dEl = $("#header-date"), tEl = $("#header-time");
  if(dEl) dEl.textContent = dateStr;
  if(tEl) tEl.textContent = timeStr;
}
setInterval(updateDateTime, 1000);
updateDateTime();

/* Cache for fast universal search */
async function getAllItems(t){
  if(allCache[t]) return allCache[t];
  const a = { live: "get_live_streams", vod: "get_vod_streams", series: "get_series" }[t];
  if(!a) return null;
  try {
    const list = await api(a);
    if(Array.isArray(list)) {
      allCache[t] = list;
      return list;
    }
  } catch(e){}
  return null;
}

/* Load Categories & Automatically Select the First Real Category */
async function loadCats(){
  grid.className = (type === "live" ? "live-mode" : "");
  cats.style.display = "flex";
  cats.innerHTML = "";
  grid.innerHTML = '<div class="msg">جاري التحميل...</div>';
  const a = { live: "get_live_categories", vod: "get_vod_categories", series: "get_series_categories" }[type];
  try {
    const list = await api(a);
    if(!Array.isArray(list) || !list.length) throw 0;
    list.forEach((c, i) => {
      const b = document.createElement("button");
      b.className = "cat f" + (i === 0 ? " on" : "");
      b.textContent = c.category_name;
      b.onclick = () => {
        document.querySelectorAll(".cat").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
        sInput.value = "";
        sClear.style.display = "none";
        loadItems(c.category_id);
      };
      cats.appendChild(b);
    });
    // Immediately load first category items without delay
    loadItems(list[0].category_id);
  } catch(e){
    grid.innerHTML = '<div class="msg">تعذر تحميل المحتوى من هذا السيرفر</div>';
  }
}

/* Load Category Items */
async function loadItems(id){
  cat = id;
  stack = [];
  grid.className = (type === "live" ? "live-mode" : "");
  grid.innerHTML = '<div class="msg">جاري التحميل...</div>';
  const a = { live: "get_live_streams", vod: "get_vod_streams", series: "get_series" }[type];
  try {
    const list = await api(`${a}&category_id=${id}`);
    if(cat !== id) return;
    if(!list || !list.length){
      currentList = [];
      grid.innerHTML = '<div class="msg">لا يوجد محتوى في هذا القسم</div>';
      return;
    }
    currentList = list;
    renderCards(list.map(x => mapItem(x, type === "live")), type === "live");
  } catch(e){
    grid.innerHTML = '<div class="msg">خطأ في التحميل</div>';
  }
}

function mapItem(x, isLive){
  return {
    name: x.name,
    pic: x.stream_icon || x.cover,
    go: () => {
      if(isLive){
        play(`${WORKER}/${server}/live/${x.stream_id}.m3u8`, x.name, true, `http://so.ta2al.us/live/MH12ARBMH12/MH12ARBMH12/${x.stream_id}.m3u8`);
      } else if(type === "vod"){
        const ext = (server === "s2") ? "m3u8" : (x.container_extension || "mp4");
        const streamUrl = `${WORKER}/${server}/movie/${x.stream_id}.${ext}`;
        const directUrl = `http://so.ta2al.us/movie/MH12ARBMH12/MH12ARBMH12/${x.stream_id}.mp4`;
        play(streamUrl, x.name, false, directUrl);
      } else {
        openSeries(x);
      }
    }
  };
}

function renderCards(items, isLive){
  grid.innerHTML = "";
  grid.className = (isLive ? "live-mode" : "");
  if(!items || !items.length){
    grid.innerHTML = '<div class="msg">لا توجد عناصر</div>';
    return;
  }
  items.forEach(it => {
    const b = document.createElement("button");
    b.className = "card f" + (isLive ? " live" : "");
    const fallback = isLive
      ? "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 90' fill='%23141414'><text x='50%25' y='50%25' fill='%23666' font-size='14' text-anchor='middle' dominant-baseline='middle'>📺</text></svg>"
      : "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 150' fill='%23141414'><text x='50%25' y='50%25' fill='%23666' font-size='14' text-anchor='middle' dominant-baseline='middle'>🎬</text></svg>";
    b.innerHTML = `<img loading="lazy" src="${esc(img(it.pic))}" onerror="this.src='${fallback}'"><p title="${esc(it.name)}">${esc(it.name)}</p>`;
    b.onclick = it.go;
    grid.appendChild(b);
  });
}

/* Universal Smooth Search */
function doSearch(){
  const raw = sInput.value.trim();
  const q = norm(raw);
  sClear.style.display = raw ? "block" : "none";

  if(type === "matches"){
    renderMatchesFiltered(q);
    return;
  }
  if(type === "news"){
    renderNewsFiltered(q);
    return;
  }

  if(!q){
    if(currentList.length) renderCards(currentList.map(x => mapItem(x, type === "live")), type === "live");
    else if(cat) loadItems(cat);
    return;
  }

  const filterAndShow = (pool) => {
    const matches = [];
    for(let i = 0; i < pool.length; i++){
      if(norm(pool[i].name).includes(q)){
        matches.push(pool[i]);
        if(matches.length >= 150) break;
      }
    }
    if(!matches.length){
      grid.innerHTML = `<div class="msg">لا توجد نتائج تطابق: "${esc(raw)}"</div>`;
    } else {
      renderCards(matches.map(x => mapItem(x, type === "live")), type === "live");
    }
  };

  if(allCache[type]){
    filterAndShow(allCache[type]);
  } else {
    if(currentList && currentList.length) filterAndShow(currentList);
    else grid.innerHTML = '<div class="msg">جاري البحث الشامل...</div>';
    getAllItems(type).then(all => {
      if(all && norm(sInput.value.trim()) === q){
        filterAndShow(all);
      }
    });
  }
}

sInput.addEventListener("input", () => {
  clearTimeout(searchT);
  searchT = setTimeout(doSearch, 80);
});
sInput.addEventListener("focus", () => getAllItems(type));
sClear.onclick = () => {
  sInput.value = "";
  sClear.style.display = "none";
  doSearch();
  sInput.focus();
};

/* Open Series Seasons and Episodes */
async function openSeries(s){
  grid.className = "";
  grid.innerHTML = '<div class="msg">جاري التحميل...</div>';
  try {
    const info = await api(`get_series_info&series_id=${s.series_id}`);
    stack.push(() => loadItems(cat));
    const seasons = Object.keys(info.episodes || {});
    const showSeason = k => {
      renderCards(info.episodes[k].map(e => {
        const ext = (server === "s2") ? "m3u8" : (e.container_extension || "mp4");
        const streamUrl = `${WORKER}/${server}/series/${e.id}.${ext}`;
        const directUrl = `http://so.ta2al.us/series/MH12ARBMH12/MH12ARBMH12/${e.id}.mp4`;
        return {
          name: `الموسم ${k} - ${e.title}`,
          pic: (e.info && e.info.movie_image) || s.cover,
          go: () => play(streamUrl, `${s.name} - ${e.title}`, false, directUrl)
        };
      }), false);
      grid.firstChild && grid.firstChild.focus();
    };
    if(seasons.length === 1) return showSeason(seasons[0]);
    renderCards(seasons.map(k => ({
      name: `الموسم ${k}`,
      pic: s.cover,
      go: () => {
        stack.push(() => openSeries(s));
        showSeason(k);
      }
    })), false);
    grid.firstChild && grid.firstChild.focus();
  } catch(e){
    grid.innerHTML = '<div class="msg">تعذر تحميل تفاصيل المسلسل</div>';
  }
}

function loadMatches(){

  let catBtns = `<button class="cat f on" data-c="all">🏆 كل المباريات (${list.length})</button>`;

    catBtns += `<button class="cat f" data-c="${esc(cName)}">${esc(cName)} (${championships[cName]})</button>`;

  cats.querySelectorAll(".cat").forEach(b => {
    b.onclick = () => {
      cats.querySelectorAll(".cat").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      activeMatchCat = b.dataset.c;
      sInput.value = "";
      sClear.style.display = "none";
      renderMatchesFiltered("");
    };
  });

  activeMatchCat = "all";
  renderMatchesFiltered("");
}

function renderMatchesFiltered(query){
  grid.className = "matches-mode";
  const list = (MATCHES_DATA && MATCHES_DATA.data) || [];
  let filtered = list;

  if(activeMatchCat !== "all"){
    filtered = filtered.filter(m => (m.championship && m.championship.title) === activeMatchCat);
  }
  if(query){
    const q = norm(query);
    filtered = filtered.filter(m => {
      const home = norm(m.home_team && m.home_team.title);
      const away = norm(m.away_team && m.away_team.title);
      const champ = norm(m.championship && m.championship.title);
      return home.includes(q) || away.includes(q) || champ.includes(q);
    });
  }

  if(!filtered.length){
    grid.innerHTML = '<div class="msg">لا توجد مباريات مطابقة</div>';
    return;
  }

  grid.innerHTML = filtered.map(m => {
    const home = m.home_team || {};
    const away = m.away_team || {};
    const champ = m.championship || {};
    const isLive = m.live === 1;
    const homeScore = m.home_scores !== null ? m.home_scores : "-";
    const awayScore = m.away_scores !== null ? m.away_scores : "-";
    const timeDisplay = isLive ? (m.score_time || "مباشر") : (m.match_time ? m.match_time.slice(0, 5) : "");
    const dateDisplay = m.match_date || "";

    const homeImg = home.image ? (home.image.startsWith("http") ? home.image : `https://imgs.ysscores.com/teams/64/${home.image}`) : "";
    const awayImg = away.image ? (away.image.startsWith("http") ? away.image : `https://imgs.ysscores.com/teams/64/${away.image}`) : "";

    return `
      <div class="match-card">
        <div class="match-head">
          <span>${esc(champ.title || "مباراة")}</span>
          ${isLive ? '<span class="match-badge-live">● مباشر</span>' : `<span class="match-badge-wait">${dateDisplay ? dateDisplay + ' ' : ''}${timeDisplay}</span>`}
        </div>
        <div class="match-body">
          <div class="team-side">
            <img src="${esc(homeImg)}" onerror="this.style.opacity='0.3'" alt="${esc(home.title)}">
            <span>${esc(home.title || "مستضيف")}</span>
          </div>
          <div class="match-center">
            <div class="match-score">${homeScore} - ${awayScore}</div>
            <div class="match-time-tag">${timeDisplay}</div>
          </div>
          <div class="team-side">
            <img src="${esc(awayImg)}" onerror="this.style.opacity='0.3'" alt="${esc(away.title)}">
            <span>${esc(away.title || "ضيف")}</span>
          </div>
        </div>
        <div class="match-foot">
          <button class="btn-watch f" onclick="playMatchLive('${esc(champ.title)}', '${esc(home.title)}', '${esc(away.title)}')">▶ مشاهدة البث</button>
          <span class="btn-channel">beIN Sports 1</span>
        </div>
      </div>
    `;
  }).join("");
}

function playMatchLive(champ, home, away){
  const channelStream = `${WORKER}/${server}/live/569493.m3u8`;
  const direct = `http://so.ta2al.us/live/MH12ARBMH12/MH12ARBMH12/569493.m3u8`;
  play(channelStream, `${home} vs ${away} (${champ})`, true, direct);
}

/* News Section */
function loadNews(){
  grid.className = "news-mode";
  cats.style.display = "none";
  renderNewsFiltered("");
}

function renderNewsFiltered(query){
  grid.className = "news-mode";
  const list = NEWS_DATA || [];
  let filtered = list;
  if(query){
    const q = norm(query);
    filtered = filtered.filter(n => norm(n.Title).includes(q));
  }
  if(!filtered.length){
    grid.innerHTML = '<div class="msg">لا توجد أخبار مطابقة</div>';
    return;
  }
  grid.innerHTML = filtered.map(n => {
    const pic = n.Image || n.Image_small || "";
    const imgUrl = pic ? (pic.startsWith("http") ? pic : `https://imgs.ysscores.com/news/320/${pic}`) : "";
    return `
      <div class="news-card">
        <img loading="lazy" src="${esc(imgUrl)}" onerror="this.style.display='none'">
        <div class="news-body">
          <h3>${esc(n.Title)}</h3>
          <div class="meta">
            <span>${esc(n.Championship_title || "كرة قدم")}</span>
            <span>${esc(n.Date_ar || "")}</span>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

/* Video Player Engine */
let lastFocus = null, idleT = null;
function play(url, title, live, directUrl){
  lastFocus = document.activeElement;
  activeDirectUrl = directUrl || url;
  P.classList.add("open");
  $("#ptitle").textContent = title;
  $("#seek").style.display = live ? "none" : "";
  $("#spin").classList.add("on");
  closeMenu();
  if(hls){
    hls.destroy();
    hls = null;
  }
  const isHls = url.includes(".m3u8");
  if(isHls && window.Hls && Hls.isSupported()){
    hls = new Hls({
      capLevelToPlayerSize: true,
      startLevel: 0,
      autoStartLoad: true,
      maxBufferLength: 10,
      maxMaxBufferLength: 20
    });
    hls.loadSource(url);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      v.play().catch(() => {});
      buildQualMenu();
    });
    hls.on(Hls.Events.ERROR, (e, data) => {
      if(data.fatal){
        if(data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if(data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        else closePlayer();
      }
    });
  } else {
    v.src = url;
    v.play().catch(() => {});
  }
  resetIdle();
}

function closePlayer(){
  if(hls){ hls.destroy(); hls = null; }
  v.pause();
  v.removeAttribute("src");
  v.load();
  P.classList.remove("open");
  $("#spin").classList.remove("on");
  closeMenu();
  if(lastFocus) lastFocus.focus();
}

/* Player Controls & Event Listeners */
$("#bPlay").onclick = () => v.paused ? v.play() : v.pause();
v.onplay = () => { $("#bPlay").textContent = "⏸"; $("#spin").classList.remove("on"); };
v.onpause = () => { $("#bPlay").textContent = "▶"; };
v.onwaiting = () => $("#spin").classList.add("on");
v.onplaying = () => $("#spin").classList.remove("on");

$("#bMute").onclick = () => {
  v.muted = !v.muted;
  $("#bMute").textContent = v.muted ? "🔇" : "🔊";
};
$("#vol").oninput = e => {
  v.volume = e.target.value;
  v.muted = false;
  $("#bMute").textContent = "🔊";
};

v.ontimeupdate = () => {
  if(!v.duration) return;
  $("#seek").value = (v.currentTime / v.duration) * 1000;
  const c = fmt(v.currentTime), d = fmt(v.duration);
  $("#time").textContent = `${c} / ${d}`;
};
$("#seek").oninput = e => {
  if(v.duration) v.currentTime = (e.target.value / 1000) * v.duration;
};

function fmt(s){
  s = Math.floor(s || 0);
  const m = Math.floor(s / 60), sec = s % 60;
  return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
}

$("#bExt").onclick = () => {
  if(activeDirectUrl) window.open(activeDirectUrl, "_blank");
};

$("#bFull").onclick = () => {
  if(document.fullscreenElement) document.exitFullscreen();
  else P.requestFullscreen().catch(() => {});
};

$("#bClose").onclick = closePlayer;

function resetIdle(){
  P.classList.remove("idle");
  clearTimeout(idleT);
  idleT = setTimeout(() => { if(!v.paused) P.classList.add("idle"); }, 4000);
}
P.onmousemove = resetIdle;
P.ontouchstart = resetIdle;

/* Quality Menu */
const menu = $("#menu");
function closeMenu(){ menu.classList.remove("open"); }
$("#bQual").onclick = () => {
  if(menu.classList.contains("open")) return closeMenu();
  menu.classList.add("open");
};

function buildQualMenu(){
  if(!hls || !hls.levels || !hls.levels.length){
    menu.innerHTML = '<h4>الجودة غير قابلة للتغيير</h4>';
    return;
  }
  menu.innerHTML = '<h4>اختر الجودة (الأقل = الأسرع)</h4>';
  const autoBtn = document.createElement("button");
  autoBtn.className = "mi f" + (hls.currentLevel === -1 ? " on" : "");
  autoBtn.textContent = "تلقائي (الأسرع)";
  autoBtn.onclick = () => { hls.currentLevel = -1; closeMenu(); };
  menu.appendChild(autoBtn);

  hls.levels.forEach((l, i) => {
    const b = document.createElement("button");
    b.className = "mi f" + (hls.currentLevel === i ? " on" : "");
    b.textContent = `${l.height || l.name || i}p (${Math.round(l.bitrate / 1000)}k)`;
    b.onclick = () => { hls.currentLevel = i; closeMenu(); };
    menu.appendChild(b);
  });
}

/* Keyboard & Remote Navigation */
window.addEventListener("keydown", e => {
  if(P.classList.contains("open")){
    resetIdle();
    if(e.key === "Escape" || e.key === "Backspace"){
      e.preventDefault();
      closePlayer();
    } else if(e.key === " " || e.key === "Enter"){
      if(e.target === v || e.target === P) {
        v.paused ? v.play() : v.pause();
      }
    }
    return;
  }
  if(e.key === "Backspace"){
    if(stack.length){
      e.preventDefault();
      stack.pop()();
    }
  }
});

// Start with live channels on first load
loadCats();
</script>
