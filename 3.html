<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AlameeereTv - منصة الترفيه</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #000; color: #fff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow-x: hidden; }
    header { position: sticky; top: 0; z-index: 100; background: rgba(0,0,0,0.95); backdrop-filter: blur(12px); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1a1a1a; }
    .logo { font-size: 20px; font-weight: 800; background: linear-gradient(90deg, #e50914, #ff5e62); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .filter-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; background: #000; scrollbar-width: none; }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .tab-btn { background: #141414; color: #aaa; border: 1px solid #222; padding: 7px 15px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .tab-btn.active, .tab-btn:hover { background: #e50914; color: #fff; border-color: #e50914; }
    
    .hero { position: relative; width: 100%; height: 50vh; min-height: 320px; max-height: 480px; overflow: hidden; background: #000; }
    .hero-bg { width: 100%; height: 100%; object-fit: cover; opacity: 0.75; transition: opacity 0.4s ease; }
    .hero-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.65) 60%, #000 100%); display: flex; flex-direction: column; justify-content: flex-end; padding: 20px 16px; }
    .hero-tag { display: inline-flex; align-items: center; gap: 6px; background: #e50914; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; margin-bottom: 8px; width: fit-content; }
    .hero-title { font-size: 24px; font-weight: 800; line-height: 1.25; margin-bottom: 6px; }
    .hero-meta { font-size: 13px; color: #bbb; display: flex; gap: 12px; margin-bottom: 14px; align-items: center; }
    .hero-btn { background: #e50914; color: #fff; border: none; padding: 10px 22px; border-radius: 6px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; width: fit-content; }
    
    .content-rows { padding: 8px 0 60px; background: #000; }
    .row { margin-bottom: 26px; }
    .row-header { display: flex; justify-content: space-between; align-items: center; padding: 0 16px 10px; }
    .row-title { font-size: 17px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    .row-title::before { content: ""; display: inline-block; width: 4px; height: 16px; background: #e50914; border-radius: 2px; }
    .items-track { display: flex; gap: 10px; overflow-x: auto; padding: 4px 16px; scrollbar-width: none; scroll-snap-type: x mandatory; }
    .items-track::-webkit-scrollbar { display: none; }
    
    .card { flex: 0 0 120px; border-radius: 8px; overflow: hidden; background: #111; cursor: pointer; transition: transform 0.2s; position: relative; scroll-snap-align: start; }
    .card:active { transform: scale(0.96); }
    .card-img-wrap { width: 100%; aspect-ratio: 2/3; background: #181818; position: relative; overflow: hidden; }
    .card-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-badge { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.75); color: #ffb703; font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; }
    .card-play-icon { position: absolute; bottom: 6px; left: 6px; background: rgba(229,9,20,0.85); color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; }
    .card-body { padding: 7px 6px 9px; }
    .card-title { font-size: 12px; font-weight: 600; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 10px; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .card.channel { flex: 0 0 105px; text-align: center; }
    .card.channel .card-img-wrap { aspect-ratio: 1/1; border-radius: 50%; padding: 14px; background: #141414; border: 1px solid #222; }
    .card.channel .card-img { object-fit: contain; }
    
    .modal { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.92); backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 16px; }
    .modal.active { display: flex; }
    .modal-box { width: 100%; max-width: 680px; background: #111; border: 1px solid #222; border-radius: 12px; overflow: hidden; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
    .modal-close { position: absolute; top: 10px; left: 10px; z-index: 10; background: #222; color: #fff; border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .modal-frame { width: 100%; aspect-ratio: 16/9; background: #000; border: none; display: none; }
    .modal-info { padding: 16px; }
    .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .modal-desc { font-size: 13px; color: #999; line-height: 1.5; }
    .modal-poster { width: 100px; aspect-ratio: 2/3; border-radius: 6px; object-fit: cover; margin-bottom: 12px; display: none; }
  </style>
</head>

  <div class="content-rows" id="content-rows"></div>

        <div class="modal-title" id="modalTitle"></div>

      </div>
    </div>
  </div>

    let currentHeroIndex = 0;
    let heroItems = [];

    function init() {
      const sliderSec = SECTIONS_DATA.find(s => s.tp === 'slider');
      if (sliderSec && sliderSec.it.length > 0) {
        heroItems = sliderSec.it;
        renderHero(0);
        setInterval(() => {
          currentHeroIndex = (currentHeroIndex + 1) % heroItems.length;
          renderHero(currentHeroIndex);
        }, 6000);
      }
      renderRows(SECTIONS_DATA);
    }

    function renderHero(idx) {
      const item = heroItems[idx];
      if (!item) return;
      document.getElementById('hero-img').src = item.p;
      document.getElementById('hero-title').textContent = item.t;
      document.getElementById('hero-meta').innerHTML = `
        <span>★ ${item.v || '8.5'}</span>
        <span>${item.g || 'عمل سينمائي'}</span>
        <span style="border:1px solid #444;padding:1px 5px;border-radius:3px;font-size:10px;">1080p</span>
      `;
      const btn = document.getElementById('hero-btn');
      btn.textContent = item.l ? '▶ تشغيل الآن' : 'تفاصيل العمل';
    }

    function playHero() {
      const item = heroItems[currentHeroIndex];
      if (item) handleItemClick(item);
    }

    function renderRows(sections) {
      const container = document.getElementById('content-rows');
      container.innerHTML = '';

      sections.forEach(sec => {
        if (sec.tp === 'slider' || !sec.it || !sec.it.length) return;

        const row = document.createElement('div');
        row.className = 'row';
        row.setAttribute('data-type', sec.tp);

        let itemsHtml = '';
        sec.it.forEach((item, idx) => {
          const isChannel = sec.tp === 'channels';
          const subText = item.ep ? (item.sn ? item.sn + ' - ' : '') + item.ep : (item.g || '');
          const ratingBadge = item.v > 0 ? `<div class="card-badge">★ ${item.v}</div>` : '';
          const playIcon = item.l ? `<div class="card-play-icon">▶</div>` : '';
          
          itemsHtml += `
            <div class="card ${isChannel ? 'channel' : ''}" data-row="${sec.tt}" data-idx="${idx}">
              <div class="card-img-wrap">
                <img class="card-img" src="${item.p}" alt="${item.t}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450/111/444?text=No+Image'">
                ${ratingBadge}
                ${playIcon}
              </div>
              <div class="card-body">
                <div class="card-title">${item.t}</div>
                ${subText ? `<div class="card-sub">${subText}</div>` : ''}
              </div>
            </div>
          `;
        });

        row.innerHTML = `
          <div class="row-header">
            <div class="row-title">${sec.tt}</div>
          </div>
          <div class="items-track">${itemsHtml}</div>
        `;
        container.appendChild(row);
      });

      container.onclick = (e) => {
        const card = e.target.closest('.card');
        if (!card) return;
        const rowTitle = card.getAttribute('data-row');
        const idx = parseInt(card.getAttribute('data-idx'), 10);
        const sec = SECTIONS_DATA.find(s => s.tt === rowTitle);
        if (sec && sec.it[idx]) handleItemClick(sec.it[idx]);
      };
    }

    function handleItemClick(item) {
      const modal = document.getElementById('playerModal');
      const frame = document.getElementById('modalFrame');
      const poster = document.getElementById('modalPoster');
      const title = document.getElementById('modalTitle');
      const desc = document.getElementById('modalDesc');

      title.textContent = item.t;

      if (item.l) {
        frame.style.display = 'block';
        frame.src = item.l;
        poster.style.display = 'none';
        desc.textContent = (item.sn ? item.sn + ' - ' : '') + (item.ep || item.g || '');
      } else {
        frame.style.display = 'none';
        frame.src = '';
        poster.style.display = 'block';
        poster.src = item.p;
        desc.innerHTML = `
          <div style="font-size:14px;color:#eee;margin-bottom:4px;"><b>التقييم:</b> ★ ${item.v || 'غير متوفر'}</div>
          <div style="font-size:14px;color:#eee;margin-bottom:8px;"><b>التصنيف:</b> ${item.g || 'أفلام ومسلسلات'}</div>
          <div style="color:#777;font-size:11px;">هذا العمل للعرض والكتالوج (لا يتوفر سيرفر تشغيل مباشر له حالياً).</div>
        `;
      }

      modal.classList.add('active');
    }

    function closeModal() {
      const modal = document.getElementById('playerModal');
      const frame = document.getElementById('modalFrame');
      frame.src = '';
      modal.classList.remove('active');
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const rows = document.querySelectorAll('.row');
      rows.forEach(r => {
        const type = r.getAttribute('data-type');
        if (cat === 'all') {
          r.style.display = 'block';
        } else if (cat === 'channels' && type === 'channels') {
          r.style.display = 'block';
        } else if (cat === 'episodes' && type === 'episodes') {
          r.style.display = 'block';
        } else if (cat === 'posters' && (type === 'posters' || type === 'collections' || type === 'actors')) {
          r.style.display = 'block';
        } else {
          r.style.display = 'none';
        }
      });
    }

    window.onload = init;
  </script>
