async function tr(list){

async function getFixtures(day,force){
  const d=new Date();d.setDate(d.getDate()+day);const date=ymd(d),key="fb_"+date;
  let c=null;try{c=JSON.parse(localStorage.getItem(key)||"null")}catch(e){}
  const hasLive=c&&c.list.some(f=>LIVE_S.includes(f.fixture.status.short));
  const ttl=day!==0?30*60e3:hasLive?2*60e3:10*60e3;
  if(c&&Date.now()-c.t<ttl&&!force)return c;
  const q=quota();if(q.n>=95&&c)return c;
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"Asia/Riyadh";
  const r=await fetch(`https://v3.football.api-sports.io/fixtures?date=${date}&timezone=${encodeURIComponent(tz)}`,{headers:{"x-apisports-key":FB_KEY}});
  const j=await r.json();q.inc();
  if(j.errors&&Object.keys(j.errors).length&&!(j.response||[]).length){if(c)return c;throw 0}
  c={t:Date.now(),list:(j.response||[]).filter(f=>LEAGUES[f.league.id])};
  try{localStorage.setItem(key,JSON.stringify(c))}catch(e){}
  return c;
}

const norm=t=>String(t||"").toLowerCase().replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآا]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ").trim();

// تحويل صوتي ذكي للمطابقة بين العربية والإنجليزية (مثل: ديكستير -> dkstr و dexter -> dkstr)
const _phCache=new Map();
function toPhonetic(s){
  const key=String(s||"");
  if(_phCache.has(key))return _phCache.get(key);
  let t=key.toLowerCase().replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآاويىةهءؤئ]/g,"");
  const m={"ب":"b","ت":"t","ث":"t","ج":"g","ح":"h","خ":"k","د":"d","ذ":"z","ر":"r","ز":"z","س":"s","ش":"s","ص":"s","ض":"d","ط":"t","ظ":"z","ع":"","غ":"g","ف":"f","ق":"k","ك":"k","ل":"l","م":"m","ن":"n","پ":"b","ڤ":"f","گ":"g"};
  t=[...t].map(c=>m[c]||c).join("");
  t=t.replace(/ph/g,"f").replace(/sh/g,"s").replace(/th/g,"t").replace(/ch/g,"s").replace(/ck/g,"k").replace(/[cq]/g,"k").replace(/x/g,"ks").replace(/p/g,"b").replace(/v/g,"f").replace(/j/g,"g").replace(/z/g,"s");
  const out=t.replace(/[aeiouywh\s\-_.:,]+/g,"");
  _phCache.set(key,out);
  return out;
}
function matchSearch(name, query){
  const n1=norm(name), q1=norm(query);
  if(n1.includes(q1)) return true;
  const pName=toPhonetic(name), pQuery=toPhonetic(query);
  return (pQuery.length>=2 && pName.includes(pQuery));
}

let lastFocus=null,idleT,recoveryTimer,recoveryAttempts=0,nativeFallback=false,playbackFailed=false,externalPlayback=false;
let curUrl="";
function armRecovery(){clearTimeout(recoveryTimer);if(P.classList.contains("open")&&!playbackFailed&&!externalPlayback)recoveryTimer=setTimeout(recoverPlayback,15000)}
function failPlayback(){
  if(playbackFailed||!P.classList.contains("open"))return;
  playbackFailed=true;
  $("#failure p").textContent="خطأ "+(v.error?v.error.code+" "+(v.error.message||""):"?")+" | "+curUrl;
  clearTimeout(recoveryTimer);clearTimeout(idleT);
  if(hls){hls.destroy();hls=null}if(ts){try{ts.destroy()}catch(e){}ts=null}v.pause();v.removeAttribute("src");v.load();
  $("#spin").classList.remove("on");$("#failure").classList.remove("hid");P.classList.remove("idle");closeMenu();
}
function attemptPlay(){v.play().catch(e=>{if(e.name==="NotAllowedError"){clearTimeout(recoveryTimer);v.muted=true;$("#bMute").textContent="🔇";v.play().then(()=>toast("اضغط 🔇 لتشغيل الصوت")).catch(()=>{$("#spin").classList.remove("on");wake()})}else if(e.name!=="AbortError")recoverPlayback()})}
function recoverPlayback(){
  if(playbackFailed||externalPlayback||!P.classList.contains("open"))return;
  clearTimeout(recoveryTimer);
  if(P.classList.contains("isLive")&&recoveryAttempts>=3&&recoveryAttempts<12){
    recoveryAttempts++;armRecovery();
    if(ts){startTs(curUrl)}else if(hls){hls.stopLoad();hls.loadSource(curUrl);hls.startLoad(-1)}else{v.src=curUrl;v.load()}
    attemptPlay();return;
  }
  if(recoveryAttempts>=(P.classList.contains("isLive")?12:3)){
    if(hls&&curUrl.includes(".m3u8")&&window.mpegts&&mpegts.isSupported()&&!nativeFallback){
      const rawUrl=curUrl.replace(/\.m3u8(\?|$)/,"$1");
      if(rawUrl!==curUrl){
        nativeFallback=true;recoveryAttempts=0;
        if(hls){try{hls.destroy()}catch(e){}hls=null}
        startTs(rawUrl);attemptPlay();armRecovery();return;
      }
    }
    if(hls&&!nativeFallback&&v.canPlayType("application/vnd.apple.mpegurl")){nativeFallback=true;hls.destroy();hls=null;v.src=curUrl;armRecovery();attemptPlay();return}
    failPlayback();return;
  }
  recoveryAttempts++;armRecovery();
  if(ts){try{ts.unload();ts.load()}catch(e){}}
  else if(hls){hls.startLoad();hls.recoverMediaError()}
  else{const position=v.currentTime;v.load();if(position>0)v.addEventListener("loadedmetadata",()=>{if(isFinite(v.duration))v.currentTime=Math.min(position,v.duration)},{once:true})}
  attemptPlay();
}
let tsRe=null;
function startTs(url){

/* Seek + skip (optimized) */
let isSeeking=false;
const seekEl=$("#seek");
function applySeek(val){
  if(!v.duration||!isFinite(v.duration))return;
  const target=(val/1000)*v.duration;
  if(typeof v.fastSeek==="function"){try{v.fastSeek(target)}catch(e){v.currentTime=target}}
  else{v.currentTime=target}
  $("#time").textContent=`${fmt(target)} / ${fmt(v.duration)}`;
}
seekEl.addEventListener("pointerdown",()=>{isSeeking=true});

["pointerup","pointercancel","touchend"].forEach(ev=>{seekEl.addEventListener(ev,()=>{setTimeout(()=>{isSeeking=false},100)})});
v.addEventListener("timeupdate",()=>{
  $("#time").textContent=`${fmt(v.currentTime)} / ${fmt(v.duration)}`;
  if(!isSeeking&&v.duration&&isFinite(v.duration))seekEl.value=(v.currentTime/v.duration)*1000;
});
function skip(s){
  if(!v.duration||!isFinite(v.duration))return;
  const target=Math.max(0,Math.min(v.duration-1,v.currentTime+s));
  if(typeof v.fastSeek==="function"){try{v.fastSeek(target)}catch(e){v.currentTime=target}}
  else{v.currentTime=target}
  toast(s>0?`⏩ +${s}`:`⏪ ${s}`);
}

/* Remote control / D-pad spatial navigation */
function visibleFocusables(){
  const root=P.classList.contains("open")?P:srvMenu.style.display==="block"?srvMenu:document;
  return [...root.querySelectorAll(".f")].filter(e=>e.getClientRects().length>0);
}
function move(dir){
  const cur=document.activeElement,els=visibleFocusables();
  if(!els.includes(cur)){els[0]&&els[0].focus();return}
  const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let best=null,bd=1e9;
  els.forEach(e=>{if(e===cur)return;const q=e.getBoundingClientRect();if(!q.width)return;const x=q.left+q.width/2,y=q.top+q.height/2,dx=x-cx,dy=y-cy;
    const ok={left:dx<-2,right:dx>2,up:dy<-2,down:dy>2}[dir];if(!ok)return;
    const main=dir==="left"||dir==="right"?Math.abs(dx):Math.abs(dy),side=dir==="left"||dir==="right"?Math.abs(dy):Math.abs(dx);
    const d=main+side*3;if(d<bd){bd=d;best=e}});
  if(best){best.focus();best.scrollIntoView({block:"nearest",inline:"nearest"})}
}
function back(){
  if(srvMenu.style.display==="block"){srvMenu.style.display="none";$("#srv").setAttribute("aria-expanded","false");$("#srv").focus();return true}
  if(menu.classList.contains("open")){closeMenu();$("#bPlay").focus();return true}
  if(P.classList.contains("open")){closePlayer();return true}
  if(stack.length){stack.pop()();return true}
  return false;
}
