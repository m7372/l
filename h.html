  [15, 30, 60].forEach(n => mk(m, n + ' دقيقة', sleepMin === n, () => setSleep(n)));
  if (sleepMin) mk(m, 'إلغاء المؤقت', false, () => setSleep(0));
  let au = [], sub = [], subOff = true;
  if (isDash && sk) {
    const langs = [...new Set(sk.getVariantTracks().map(t => t.language))];
    const act = sk.getVariantTracks().find(t => t.active);
    if (langs.length > 1) au = langs.map(l => ({ n: langName(l), a: act && act.language === l, f: () => { sk.selectAudioLanguage(l); setTimeout(() => { const c = sk.getVariantTracks().filter(t => t.language === l).sort((x, y) => x.bandwidth - y.bandwidth)[0]; if (c) sk.selectVariantTrack(c, true); buildQualityDash(); }, 250); } }));
    const tt = sk.getTextTracks(); subOff = !sk.isTextTrackVisible();
    sub = tt.map(t => ({ n: langName(t.language) || t.label, a: !subOff && t.active, f: () => { sk.selectTextTrack(t); sk.setTextTrackVisibility(true); } }));
    if (sub.length) sub.unshift({ n: 'بدون ترجمة', a: subOff, f: () => sk.setTextTrackVisibility(false) });
  } else if (hls) {
    if (hls.audioTracks && hls.audioTracks.length > 1) au = hls.audioTracks.map((t, k) => ({ n: t.name || langName(t.lang) || ('مسار ' + (k + 1)), a: k === hls.audioTrack, f: () => { hls.audioTrack = k; } }));
    if (hls.subtitleTracks && hls.subtitleTracks.length) { sub = hls.subtitleTracks.map((t, k) => ({ n: t.name || langName(t.lang) || ('ترجمة ' + (k + 1)), a: k === hls.subtitleTrack, f: () => { hls.subtitleTrack = k; } })); sub.unshift({ n: 'بدون ترجمة', a: hls.subtitleTrack === -1, f: () => { hls.subtitleTrack = -1; } }); }
  }
  if (au.length) { m.appendChild(document.createElement('hr')); m.insertAdjacentHTML('beforeend', '<h4>الصوت</h4>'); au.forEach(o => mk(m, o.n, o.a, () => { o.f(); setTimeout(buildTools, 350); })); }
  if (sub.length) { m.appendChild(document.createElement('hr')); m.insertAdjacentHTML('beforeend', '<h4>الترجمة</h4>'); sub.forEach(o => mk(m, o.n, o.a, () => { o.f(); setTimeout(buildTools, 350); })); }
}
function refreshTools(){ if (menuOpen === 'tMenu') buildTools(); }
function updStats(){
  let q = '-';
  if (isDash && sk) { const t = sk.getVariantTracks().find(t => t.active); if (t) q = t.height ? t.height + 'p' : Math.round(t.bandwidth / 1000) + ' kbps'; }
  else if (hls && hls.levels[hls.currentLevel]) { const l = hls.levels[hls.currentLevel]; q = l.height ? l.height + 'p' : Math.round(l.bitrate / 1000) + ' kbps'; }
  let buf = 0; for (let k = 0; k < v.buffered.length; k++) if (v.currentTime >= v.buffered.start(k) - .3 && v.currentTime <= v.buffered.end(k)) buf = v.buffered.end(k) - v.currentTime;
  const qq = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : null;
  $('spStats').innerHTML = 'الجودة الحالية: ' + q + '<br>المخزن: ' + buf.toFixed(1) + ' ثانية' + (qq ? '<br>الإطارات المفقودة: ' + qq.droppedVideoFrames : '');
}
function closeMenus(){ ['qMenu','spMenu','tMenu'].forEach(i => $(i).classList.remove('open')); if (menuOpen === 'spMenu') stopSpeed(); menuOpen = null; }
function toggleMenu(id){
  const was = menuOpen === id; closeMenus();
  if (!was) { $(id).classList.add('open'); menuOpen = id; if (id === 'spMenu') startSpeed(); if (id === 'tMenu') buildTools(); }
  poke();
}
$('bQual').onclick = e => { e.stopPropagation(); toggleMenu('qMenu'); };
$('bTools').onclick = e => { e.stopPropagation(); toggleMenu('tMenu'); };
$('bPrev').onclick = () => play(cur - 1);
$('bNext').onclick = () => play(cur + 1);
$('bSpeed').onclick = e => { e.stopPropagation(); toggleMenu('spMenu'); };

function setPlayIcon(){ $('bPlay').innerHTML = v.paused ? ICON.play : ICON.pause; }
function setVolIcon(){ $('bMute').innerHTML = (v.muted || v.volume === 0) ? ICON.mute : ICON.vol; $('vol').value = v.muted ? 0 : v.volume; $('vol').style.setProperty('--p', ($('vol').value * 100) + '%'); }
function setFitIcon(){ const f = FITS[fitIdx]; $('bFit').innerHTML = ICON[f.i]; $('bFit').title = f.l; $('bFit').setAttribute('aria-label', 'قياس الفيديو: ' + f.l); v.classList.remove('m-cover','m-fill','m-squeeze'); if (f.k !== 'contain') v.classList.add('m-' + f.k); }
function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement) || stage.classList.contains('fs'); }
function setFsIcon(){ $('bFs').innerHTML = isFs() ? ICON.fsx : ICON.fs; }
$('bPlay').onclick = () => { v.paused ? v.play() : v.pause(); poke(); };
$('bMute').onclick = () => { v.muted = !v.muted; if (!v.muted && v.volume === 0) v.volume = .5; setVolIcon(); poke(); };
$('vol').oninput = e => { v.muted = false; v.volume = +e.target.value; setVolIcon(); poke(); };
$('bFit').onclick = () => { fitIdx = (fitIdx + 1) % 4; try { localStorage.setItem('atv_fit', fitIdx); } catch (e) {} setFitIcon(); hud(FITS[fitIdx].l); poke(); };
async function toggleFs(){
  try {
    if (!isFs()) {
      if (stage.requestFullscreen) await stage.requestFullscreen(); else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen(); else throw 0;
      try { await screen.orientation.lock('landscape'); } catch (e) {}
    } else {
      try { screen.orientation.unlock(); } catch (e) {}
      if (stage.classList.contains('fs')) stage.classList.remove('fs');
      else if (document.exitFullscreen) await document.exitFullscreen(); else document.webkitExitFullscreen();
    }
  } catch (e) { stage.classList.toggle('fs'); }
  setFsIcon(); poke();
}
$('bFs').onclick = toggleFs;
v.addEventListener('play', setPlayIcon); v.addEventListener('pause', setPlayIcon);
v.addEventListener('volumechange', setVolIcon);
let loaderAt=0;
function loaderOn(){ if($('loader').classList.contains('off')) loaderAt=Date.now(); $('loader').classList.remove('off'); }
function loaderOff(){ const w=Math.max(0,2600-(Date.now()-loaderAt)); clearTimeout(loaderOff.t); loaderOff.t=setTimeout(()=>{ if(!v.paused||v.readyState>2) $('loader').classList.add('off'); },w); }
v.addEventListener('playing', () => { loaderOff(); retries = 0; $('buf').classList.remove('on'); getWake(); });
v.addEventListener('waiting', () => { loaderOn(); $('buf').classList.add('on'); });
v.addEventListener('canplay', () => $('buf').classList.remove('on'));
v.addEventListener('pause', () => { if (wake) { wake.release().catch(() => {}); wake = null; } });
async function getWake(){ try { if (!wake && navigator.wakeLock && !document.hidden) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden && !v.paused) getWake(); });
v.addEventListener('volumechange', () => { try { localStorage.setItem('atv_vol', v.volume); localStorage.setItem('atv_muted', v.muted ? '1' : '0'); } catch (e) {} });

function show(){ stage.classList.remove('hide'); }
function poke(){
  show(); clearTimeout(hideT);
  hideT = setTimeout(() => { if (menuOpen || dragging) { poke(); return; } if (!v.paused || isFs()) { stage.classList.add('hide'); } }, HIDE_MS);
}
['mousemove','pointerdown','pointermove','touchstart','touchmove','keydown'].forEach(ev => stage.addEventListener(ev, poke, { passive: true }));
const vol = $('vol');
['pointerdown','touchstart','mousedown'].forEach(ev => vol.addEventListener(ev, () => { dragging = true; }, { passive: true }));
['pointerup','pointercancel','touchend','touchcancel','mouseup','change'].forEach(ev => window.addEventListener(ev, () => { if (dragging) { dragging = false; poke(); } }, { passive: true }));
['fullscreenchange','webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { setFsIcon(); poke(); }));
['resize','orientationchange'].forEach(ev => window.addEventListener(ev, () => setTimeout(poke, 50)));
stage.addEventListener('pointerdown', e => { if (!e.target.closest('.menu,.bar,#reload')) closeMenus(); });

let g = null, lastTap = 0, tapT = null, bright = 1;
stage.addEventListener('touchstart', e => {
  if (e.target.closest('.bar,.menu,#reload')) { g = null; return; }
  const t = e.touches[0], r = stage.getBoundingClientRect();
  g = { x: t.clientX, y: t.clientY, left: (t.clientX - r.left) < r.width / 2, moved: false, vol: v.volume, br: bright, h: r.height };
}, { passive: true });
stage.addEventListener('touchmove', e => {
  if (!g) return;
  const t = e.touches[0], dy = g.y - t.clientY, dx = t.clientX - g.x;
  if (Math.abs(dy) < 12 && !g.moved) return;
  if (Math.abs(dx) > Math.abs(dy) && !g.moved) { g = null; return; }
  g.moved = true; e.preventDefault();
  const d = dy / (g.h * 0.8);
  if (g.left) { bright = Math.min(1.6, Math.max(.3, g.br + d)); v.style.filter = 'brightness(' + bright + ')'; try { localStorage.setItem('atv_br', bright); } catch (e) {} hud('السطوع ' + Math.round(bright * 100) + '%'); }
  else { v.muted = false; v.volume = Math.min(1, Math.max(0, g.vol + d)); hud('الصوت ' + Math.round(v.volume * 100) + '%'); }
}, { passive: false });
stage.addEventListener('touchend', e => {
  if (!g) return;
  if (g.moved) { g = null; return; }
  g = null;
  const now = Date.now();
  if (now - lastTap < 320) { clearTimeout(tapT); lastTap = 0; toggleFs(); return; }
  lastTap = now;
  poke();
});
stage.addEventListener('dblclick', e => { if (!e.target.closest('.bar,.menu')) toggleFs(); });

document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input[type=search]')) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key, onBtn = e.target.closest && e.target.closest('button');
  const vol = d => { v.muted = false; v.volume = Math.min(1, Math.max(0, v.volume + d)); hud('الصوت ' + Math.round(v.volume * 100) + '%'); };
  if (k === 'ArrowRight' || k === 'PageUp' || k === 'ChannelUp' || k === 'MediaTrackPrevious') { play(cur - 1); e.preventDefault(); }
  else if (k === 'ArrowLeft' || k === 'PageDown' || k === 'ChannelDown' || k === 'MediaTrackNext') { play(cur + 1); e.preventDefault(); }
  else if (k === 'ArrowUp') { vol(.05); e.preventDefault(); }
  else if (k === 'ArrowDown') { vol(-.05); e.preventDefault(); }
  else if (k === 'MediaPlayPause' || (k === 'Enter' && !onBtn) || (k === ' ' && !onBtn)) { v.paused ? v.play() : v.pause(); e.preventDefault(); }
  else if (k === 'f' || k === 'F') toggleFs();
  else if (k === 'm' || k === 'M') { v.muted = !v.muted; hud(v.muted ? 'كتم' : 'الصوت ' + Math.round(v.volume * 100) + '%'); }
  poke();
});

const intro=$('intro');const endIntro=()=>intro.classList.add('out');intro.onclick=endIntro;setTimeout(endIntro,5200);setTimeout(()=>intro.remove(),6500);
$('bPrev').innerHTML = ICON.prev; $('bNext').innerHTML = ICON.next; $('bTools').innerHTML = ICON.more;
try {
  const sv0 = localStorage.getItem('atv_vol'); if (sv0 !== null && !isNaN(+sv0)) v.volume = Math.min(1, Math.max(0, +sv0));
  v.muted = localStorage.getItem('atv_muted') === '1';
  const sb = +localStorage.getItem('atv_br'); if (sb >= .3 && sb <= 1.6) { bright = sb; v.style.filter = 'brightness(' + bright + ')'; }
} catch (e) {}
renderSections();
setPlayIcon(); setVolIcon(); setFitIcon(); setFsIcon();
const lastI = idxOf(ld('atv_last', ''));
play(lastI >= 0 ? lastI : 0);
</script>
