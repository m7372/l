<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#080808">
<meta name="description" content="AlameeereTv - القنوات والأفلام والمسلسلات">
<title>AlameeereTv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
:root{
 --red:#e50914;
 --bg:#080808;
 --card:#171717;
 --muted:#aaa;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;
 background:var(--bg);
 color:white;
 font-family:Cairo,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
header{
 min-height:66px;
 position:sticky;
 top:0;
 z-index:30;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 4%;
 background:#090909f5;
 border-bottom:1px solid #252525;
}
.logo{
 font-size:23px;
 font-weight:900;
 direction:ltr;
 white-space:nowrap;
}
.logo span{color:var(--red)}
nav{
 display:flex;
 align-items:center;
 gap:8px;
}
nav button{
 background:none;
 border:0;
 color:#ccc;
 font-size:14px;
 padding:9px;
 border-radius:7px;
}
nav button.active,
nav button:hover{
 color:white;
 background:#291012;
}
main{
 max-width:1450px;
 margin:auto;
 padding:18px 4%;
}
.player-box{
 background:#080808;
 padding:8px 0 14px;
}
video{
 display:block;
 width:100%;
 aspect-ratio:16/9;
 max-height:70vh;
 background:#000;
 border-radius:12px;
}
.player-info{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:10px 3px;
}
.live{color:#ff3030;font-size:13px}
.hero{
 min-height:190px;
 border:1px solid #351014;
 border-radius:15px;
 background:linear-gradient(100deg,#080808,#330609,#090909);
 padding:25px;
 margin:18px 0;
 display:flex;
 flex-direction:column;
 justify-content:center;
}
.hero h1{font-size:29px;margin:0}
.hero p{color:#bbb;margin:8px 0}
.install-btn{
 display:none;
 width:max-content;
 background:var(--red);
 color:white;
 border:0;
 padding:10px 20px;
 border-radius:8px;
 font-weight:700;
}
.search{
 width:100%;
 padding:13px;
 border-radius:9px;
 border:1px solid #333;
 background:#171717;
 color:white;
 font-size:15px;
 outline:none;
}
.search:focus{border-color:var(--red)}
.categories{
 display:flex;
 gap:9px;
 overflow-x:auto;
 padding:12px 0;
 scrollbar-width:thin;
}
.cat{
 white-space:nowrap;
 padding:8px 17px;
 border:1px solid #333;
 background:#171717;
 color:white;
 border-radius:30px;
}
.cat.selected{
 background:var(--red);
 border-color:var(--red);
}
.section-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:20px 0 12px;
}
.section-head h2{font-size:19px}
#count{font-size:12px;color:var(--muted)}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
 gap:15px;
}
.item{
 background:var(--card);
 border:1px solid #252525;
 border-radius:10px;
 overflow:hidden;
 cursor:pointer;
 position:relative;
 transition:transform .2s,border-color .2s;
}
.item:hover,.item:focus{
 transform:translateY(-3px);
 border-color:var(--red);
 outline:none;
}
.item img{
 display:block;
 width:100%;
 aspect-ratio:4/5;
 object-fit:cover;
 background:#252525;
}
.item-name{
 padding:10px;
 font-size:13px;
}
.fav{
 position:absolute;
 top:8px;
 left:8px;
 background:#111d;
 color:white;
 border:0;
 border-radius:50%;
 width:36px;
 height:36px;
 font-size:19px;
}
.empty{
 padding:35px;
 text-align:center;
 color:#aaa;
 grid-column:1/-1;
}
.message{
 padding:25px;
 text-align:center;
 color:#aaa;
}
footer{
 text-align:center;
 color:#777;
 border-top:1px solid #222;
 padding:25px;
 margin-top:40px;
}
button:focus-visible,
input:focus-visible,
.item:focus-visible{
 outline:2px solid var(--red);
 outline-offset:3px;
}
@media(max-width:600px){
 header{padding:0 3%;min-height:60px}
 .logo{font-size:18px}
 nav{gap:2px}
 nav button{font-size:11px;padding:7px 4px}
 main{padding:12px 3%}
 .hero{min-height:150px;padding:18px}
 .hero h1{font-size:22px}
 .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
 .item-name{font-size:11px;padding:7px}
 .section-head h2{font-size:16px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{
  scroll-behavior:auto!important;
  transition:none!important;
 }
}
</style>
</head>
<body>
<header>
ALAMEEERE
TV
 <nav id="navigation">
  <button class="active" data-section="live">الرئيسية</button>
  <button data-section="live">القنوات</button>
  <button data-section="movie">الأفلام</button>
  <button data-section="series">المسلسلات</button>
  <button data-section="favorites">♥ المفضلة</button>
 </nav>
</header>
<main>
<section class="player-box">
 <video id="player" controls playsinline preload="none"></video>
  <strong id="playingTitle">AlameeereTv
● LIVE
</section>
<section class="hero">
 <h1>عالم الترفيه بين يديك</h1>
قنوات مباشرة، رياضة، أفلام ومسلسلات
 <button id="installBtn" class="install-btn">
  تنزيل تطبيق AlameeereTv
 </button>
</section>
<input
 id="search"
 class="search"
 placeholder="ابحث عن قناة أو فيلم أو مسلسل..."
 autocomplete="off"
 <h2 id="sectionTitle">القنوات المباشرة</h2>
0 عنصر
<section id="items" class="grid">
جاري الاتصال بالسيرفر...
</section>
<footer>
 AlameeereTv © 2026
 جميع الحقوق محفوظة
</footer>
</main>
<script>
"use strict";
/* إعداد السيرفر الأصلي */
const API = "https://b.m737217130.workers.dev";
/* حالة التطبيق */
let section = "live";
let items = [];
let categories = [];
let selectedCategory = "all";
let favorites = new Map();
let hls = null;
let installPrompt = null;
let requestNumber = 0;
let favoritesRequest = false;
const player = document.getElementById("player");
const itemsBox = document.getElementById("items");
const categoriesBox = document.getElementById("categories");
const searchInput = document.getElementById("search");
const titles = {
 live:"القنوات المباشرة",
 movie:"الأفلام",
 series:"المسلسلات",
 favorites:"المفضلة"
};
const blocked = [
 "xxx","porn","adult","erotic","sex",
 "إباحي","اباحي","جنس","للكبار",
 "إباحية","اباحية"
];
/* فلترة المحتوى */
function isAllowed(item){
 const text = (
  (item.name || "") + " " +
  (item.category_name || "")
 ).toLowerCase();
 return !blocked.some(word => text.includes(word));
}
/* الاتصال بالسيرفر */
async function api(path){
 const response = await fetch(API + path);
 if(!response.ok){
  throw new Error("API error: " + response.status);
 }
 return response.json();
}
/* حفظ المفضلة */
function saveFavorites(){
 try{
  localStorage.setItem(
   "alameeere_favorites",
   JSON.stringify([...favorites.entries()])
  );
 }catch(error){
  console.warn("تعذر حفظ المفضلة",error);
 }
}
/* تحميل المفضلة */
function loadFavorites(){
 try{
  const saved = JSON.parse(
   localStorage.getItem("alameeere_favorites") || "[]"
  );
  favorites = new Map(
   saved.filter(entry =>
    Array.isArray(entry) &&
    entry.length === 2
   )
  );
 }catch(error){
  favorites = new Map();
 }
}
/* تغيير القسم */
async function loadSection(type){
 section = type;
 selectedCategory = "all";
 searchInput.value = "";
 const currentRequest = ++requestNumber;
 document.getElementById("sectionTitle").textContent =
  titles[type] || "المحتوى";
 document.querySelectorAll("nav button").forEach(button=>{
  button.classList.toggle(
   "active",
   button.dataset.section === type
  );
 });
 categoriesBox.innerHTML = "";
 itemsBox.innerHTML =
  '
جاري تحميل المحتوى...
';
 if(type === "favorites"){
  await loadFavoriteItems(currentRequest);
  return;
 }
 favoritesRequest = false;
 try{
  const data = await api(
   "/api/catalog?type=" + encodeURIComponent(type)
  );
  if(currentRequest !== requestNumber) return;
  items = Array.isArray(data.items)
   ? data.items.filter(isAllowed)
   : [];
  categories = Array.isArray(data.categories)
   ? data.categories.filter(cat =>
      !blocked.some(word =>
       String(cat.name || "").toLowerCase().includes(word)
      )
     )
   : [];
  renderCategories();
  renderItems();
 }catch(error){
  if(currentRequest !== requestNumber) return;
  showError("تعذر الاتصال بالسيرفر. حاول مرة أخرى.");
  console.error(error);
 }
}
/* تحميل محتويات المفضلة من الأقسام */
async function loadFavoriteItems(currentRequest){
 favoritesRequest = true;
 try{
  const types = ["live","movie","series"];
  const results = await Promise.all(
   types.map(type =>
    api("/api/catalog?type=" + type)
   )
  );
  if(currentRequest !== requestNumber) return;
  const allItems = [];
  results.forEach((data,index)=>{
   if(Array.isArray(data.items)){
    data.items.forEach(item=>{
     if(isAllowed(item)){
      allItems.push({
       ...item,
       type:types[index]
      });
     }
    });
   }
  });
  items = allItems.filter(item =>
   favorites.has(String(item.id))
  );
  categories = [];
  renderCategories();
  renderItems();
 }catch(error){
  if(currentRequest !== requestNumber) return;
  showError("تعذر تحميل المفضلة.");
  console.error(error);
 }
}
/* رسائل الخطأ */
function showError(message){
 itemsBox.innerHTML = "";
 const div = document.createElement("div");
 div.className = "empty";
 div.textContent = message;
 itemsBox.appendChild(div);
}
/* التصنيفات */
function renderCategories(){
 categoriesBox.innerHTML = "";
 if(section === "favorites") return;
 addCategory("all","الكل");
 categories.forEach(cat=>{
  addCategory(String(cat.id),cat.name);
 });
}
function addCategory(id,name){
 const button = document.createElement("button");
 button.className =
  "cat" + (selectedCategory === id ? " selected" : "");
 button.textContent = name;
 button.onclick = ()=>{
  selectedCategory = id;
  renderCategories();
  renderItems();
 };
 categoriesBox.appendChild(button);
}
/* عرض المحتوى */
function renderItems(){
 const query = searchInput.value.toLowerCase().trim();
 const filtered = items.filter(item=>{
  const categoryMatch =
   selectedCategory === "all" ||
   String(item.category_id) === selectedCategory;
  const searchMatch =
   (item.name || "").toLowerCase().includes(query);
  return categoryMatch && searchMatch && isAllowed(item);
 });
 document.getElementById("count").textContent =
  filtered.length + " عنصر";
 itemsBox.innerHTML = "";
 if(!filtered.length){
  const empty = document.createElement("div");
  empty.className = "empty";
  empty.textContent = "لا توجد نتائج حالياً";
  itemsBox.appendChild(empty);
  return;
 }
 const fragment = document.createDocumentFragment();
 filtered.forEach(item=>{
  const card = document.createElement("article");
  card.className = "item";
  card.tabIndex = 0;
  card.setAttribute("role","button");
  const img = document.createElement("img");
  img.loading = "lazy";
  img.decoding = "async";
  img.src = item.image || "";
  img.alt = item.name || "محتوى";
  img.onerror = ()=>{
   img.removeAttribute("src");
   img.alt = "الصورة غير متاحة";
  };
  const name = document.createElement("div");
  name.className = "item-name";
  name.textContent = item.name || "بدون اسم";
  const fav = document.createElement("button");
  fav.className = "fav";
  fav.type = "button";
  fav.textContent =
   favorites.has(String(item.id)) ? "♥" : "♡";
  fav.setAttribute("aria-label","إضافة للمفضلة");
  fav.onclick = event=>{
   event.stopPropagation();
   toggleFavorite(item);
  };
  card.append(img,name,fav);
  card.onclick = ()=>playItem(item);
  card.onkeydown = event=>{
   if(event.key === "Enter" || event.key === " "){
    event.preventDefault();
    playItem(item);
   }
  };
  fragment.appendChild(card);
 });
 itemsBox.appendChild(fragment);
}
/* المفضلة */
function toggleFavorite(item){
 const key = String(item.id);
 if(favorites.has(key)){
  favorites.delete(key);
 }else{
  favorites.set(key,{
   ...item,
   type:item.type || section
  });
 }
 saveFavorites();
 if(section === "favorites"){
  loadSection("favorites");
 }else{
  renderItems();
 }
}
/* اختيار المحتوى */
function playItem(item){
 document.getElementById("playingTitle").textContent =
  item.name || "AlameeereTv";
 const streamType = item.type || section;
 playStream(item.id,streamType);
 document.querySelector(".player-box").scrollIntoView({
  behavior:"smooth",
  block:"start"
 });
}
/* إيقاف المشغل */
function stopPlayer(){
 player.pause();
 if(hls){
  hls.destroy();
  hls = null;
 }
 player.removeAttribute("src");
 player.load();
}
/* تشغيل HLS */
async function playStream(id,type){
 try{
  stopPlayer();
  const data = await api(
   "/api/stream?type=" +
   encodeURIComponent(type) +
   "&id=" + encodeURIComponent(id)
  );
  if(!data.url){
   throw new Error("Stream URL missing");
  }
  if(typeof Hls !== "undefined" && Hls.isSupported()){
   hls = new Hls({
    enableWorker:true,
    lowLatencyMode:true,
    backBufferLength:30
   });
   hls.on(Hls.Events.ERROR,(event,error)=>{
    if(!error.fatal) return;
    console.error("HLS error:",error);
    if(error.type === Hls.ErrorTypes.NETWORK_ERROR){
     hls.startLoad();
    }else if(error.type === Hls.ErrorTypes.MEDIA_ERROR){
     hls.recoverMediaError();
    }else{
     stopPlayer();
     showPlayerError();
    }
   });
   hls.on(Hls.Events.MANIFEST_PARSED,()=>{
    player.play().catch(error=>{
     console.warn("Play requires user interaction",error);
    });
   });
   hls.loadSource(data.url);
   hls.attachMedia(player);
  }else if(
   player.canPlayType("application/vnd.apple.mpegurl")
  ){
   player.src = data.url;
   player.play().catch(error=>{
    console.warn(error);
   });
  }else{
   throw new Error("HLS not supported");
  }
 }catch(error){
  console.error(error);
  showPlayerError();
 }
}
function showPlayerError(){
 document.getElementById("playingTitle").textContent =
  "تعذر تشغيل المحتوى";
}
/* البحث */
searchInput.addEventListener("input",renderItems);
/* أزرار التنقل */
document.getElementById("navigation").addEventListener(
 "click",
 event=>{
  const button = event.target.closest("button[data-section]");
  if(button){
   loadSection(button.dataset.section);
  }
 }
);
/* التحكم بالريموت */
document.addEventListener("keydown",event=>{
 const key = event.key;
 const active = document.activeElement;
 if(active === searchInput) return;
 const cards = [...document.querySelectorAll(".item")];
 const navButtons = [
  ...document.querySelectorAll("nav button")
 ];
 const currentCard = cards.indexOf(active);
 const currentNav = navButtons.indexOf(active);
 if(key === "ArrowRight" || key === "ArrowLeft"){
  if(currentCard >= 0){
   event.preventDefault();
   const step = key === "ArrowLeft" ? 1 : -1;
   const next = Math.max(
    0,
    Math.min(cards.length-1,currentCard+step)
   );
   cards[next].focus();
  }else if(currentNav >= 0){
   event.preventDefault();
   const step = key === "ArrowLeft" ? 1 : -1;
   navButtons[
    Math.max(0,Math.min(navButtons.length-1,currentNav+step))
   ].focus();
  }
 }
 if(key === "ArrowDown"){
  if(currentNav >= 0){
   event.preventDefault();
   if(cards.length){
    cards[0].focus();
   }else{
    searchInput.focus();
   }
  }else if(currentCard >= 0){
   event.preventDefault();
   const next = Math.min(
    cards.length-1,
    currentCard + getGridColumns()
   );
   cards[next].focus();
  }
 }
 if(key === "ArrowUp"){
  if(currentCard >= 0){
   event.preventDefault();
   const next = currentCard - getGridColumns();
   if(next < 0){
    navButtons[0].focus();
   }else{
    cards[next].focus();
   }
  }
 }
 if(key === "Escape" || key === "Backspace"){
  if(active !== player){
   event.preventDefault();
   if(section !== "live"){
    loadSection("live");
   }else{
    searchInput.blur();
    player.focus();
   }
  }
 }
});
/* عدد أعمدة الشبكة */
function getGridColumns(){
 const grid = document.querySelector(".grid");
 if(!grid) return 1;
 const style = getComputedStyle(grid);
 return Math.max(
  1,
  Math.round(
   grid.clientWidth /
   (parseFloat(style.gridTemplateColumns.split(" ")[0]) || 145)
  )
 );
}
/* تحميل المفضلة عند البداية */
loadFavorites();
/* تثبيت التطبيق عند دعم المتصفح */
window.addEventListener("beforeinstallprompt",event=>{
 event.preventDefault();
 installPrompt = event;
 document.getElementById("installBtn").style.display =
  "block";
});
document.getElementById("installBtn").onclick = async ()=>{
 if(!installPrompt){
  alert("استخدم قائمة المتصفح واختر إضافة إلى الشاشة الرئيسية.");
  return;
 }
 await installPrompt.prompt();
 installPrompt = null;
 document.getElementById("installBtn").style.display =
  "none";
};
window.addEventListener("appinstalled",()=>{
 document.getElementById("installBtn").style.display =
  "none";
});
/* بدء التطبيق */
loadSection("live");
</script>
</body>
</html>
