<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>ALAMEEERE TV</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
:root {
 --red:#e50914;
 --bg:#080808;
 --card:#171717;
 --muted:#aaa;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:#fff;
 font-family:Cairo,sans-serif;
}
header{
 height:68px;position:sticky;top:0;z-index:20;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 5%;background:#090909ed;
 border-bottom:1px solid #222;
}
.logo{font-size:25px;font-weight:900}
.logo span{color:var(--red)}
nav{display:flex;gap:20px}
nav button{
 background:none;border:0;color:#ccc;
 font:inherit;cursor:pointer;
}
nav button:hover,.active{color:var(--red)}
main{max-width:1450px;margin:auto;padding:22px 4%}
.player-box{
 position:sticky;top:68px;z-index:10;
 background:#080808;padding:10px 0;
}
video{
 width:100%;aspect-ratio:16/9;
 background:#000;border-radius:12px;
}
.player-info{
 display:flex;justify-content:space-between;
 align-items:center;padding:8px 2px;
}
.live{color:#ff3030;font-size:13px}
.hero{
 min-height:210px;border-radius:15px;
 background:linear-gradient(90deg,#080808,#330609,#090909);
 padding:28px;margin:20px 0;
 display:flex;flex-direction:column;
 justify-content:center;
}
.hero h1{font-size:30px;margin:0}
.hero p{color:#bbb}
.section-head{
 display:flex;justify-content:space-between;
 align-items:center;margin:28px 0 14px;
}
.section-head h2{font-size:19px}
.search{
 width:100%;padding:13px;border-radius:9px;
 border:1px solid #333;background:#171717;
 color:white;font:inherit;outline:none;
}
.categories{
 display:flex;gap:9px;overflow-x:auto;
 padding:8px 0 16px;
}
.cat{
 white-space:nowrap;padding:9px 17px;
 border:1px solid #333;background:#171717;
 color:white;border-radius:30px;cursor:pointer;
}
.cat.selected{background:var(--red);border-color:var(--red)}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
 gap:15px;
}
.item{
 background:var(--card);border-radius:10px;
 overflow:hidden;cursor:pointer;
 transition:.2s;position:relative;
}
.item:hover{transform:translateY(-4px)}
.item img{
 width:100%;aspect-ratio:4/5;
 object-fit:cover;background:#252525;
}
.item-name{padding:10px;font-size:13px}
.fav{
 position:absolute;top:8px;left:8px;
 background:#111d;color:white;
 border:0;border-radius:50%;
 width:32px;height:32px;cursor:pointer;
}
.empty{
 padding:35px;text-align:center;color:#aaa;
 grid-column:1/-1;
}
footer{
 text-align:center;color:#777;
 border-top:1px solid #222;
 padding:25px;margin-top:40px;
}
@media(max-width:600px){
 header{padding:0 3%;height:60px}
 .logo{font-size:19px}
 nav{gap:10px}
 nav button{font-size:11px}
 main{padding:12px 3%}
 .hero{min-height:160px;padding:18px}
 .hero h1{font-size:23px}
 .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
 .item-name{font-size:11px}
 .player-box{top:60px}
}
</style>
</head>
<body>
<header>
ALAMEEERE
TV
 <nav>
  <button onclick="loadSection('live')">الرئيسية</button>
  <button onclick="loadSection('live')">القنوات</button>
  <button onclick="loadSection('movie')">الأفلام</button>
  <button onclick="loadSection('series')">المسلسلات</button>
 </nav>
</header>
<main>
<section class="player-box">
 <video id="player" controls playsinline></video>
  <strong id="playingTitle">ALAMEEERE TV
**● LIVE**
**</section>**
**<section class="hero">**
**<h1>عالم الترفيه بين يديك</h1>**
**قنوات مباشرة، رياضة، أفلام ومسلسلات**
ALAMEEERE TV
</section>
<input id="search" class="search"
 placeholder="ابحث عن قناة أو فيلم أو مسلسل..."
 oninput="renderItems()">
 <h2 id="sectionTitle">القنوات المباشرة</h2>
جاري الاتصال بالسيرفر...
<footer>
 ALAMEEERE TV © 2026
جميع الحقوق محفوظة
</footer>
</main>
<script>
"use strict";
/*
  عنوان وسيط Cloudflare Worker.
  يجب أن يوفر المسارات الموضحة في تعليمات الربط.
*/
const API = "https://b.m737217130.workers.dev";
let section = "live";
let items = [];
let categories = [];
let selectedCategory = "all";
let favorites = new Set();
const player = document.getElementById("player");
let hls = null;
const blocked = [
 "xxx","porn","adult","erotic","sex",
 "إباحي","اباحي","جنس","للكبار",
 "إباحية","اباحية"
];
function isAllowed(item){
 const name = (item.name || "").toLowerCase();
 const category = (item.category_name || "").toLowerCase();
 const text = name + " " + category;
 return !blocked.some(word => text.includes(word));
}
async function api(path){
 const response = await fetch(API + path);
 if(!response.ok){
  throw new Error("API error: " + response.status);
 }
 return response.json();
}
async function loadSection(type){
 section = type;
 selectedCategory = "all";
 const titles = {
  live:"القنوات المباشرة",
  movie:"الأفلام",
  series:"المسلسلات"
 };
 document.getElementById("sectionTitle").textContent =
  titles[type] || "المحتوى";
 document.getElementById("items").innerHTML =
  '
جاري تحميل المحتوى...
';
 try{
  const data = await api("/api/catalog?type=" + type);
  items = Array.isArray(data.items) ? data.items : [];
  categories = Array.isArray(data.categories)
   ? data.categories : [];
  items = items.filter(isAllowed);
  categories = categories.filter(isAllowed);
  renderCategories();
  renderItems();
 }catch(error){
  document.getElementById("items").innerHTML =
   '
تعذر الاتصال بالسيرفر. تحقق من إعدادات Worker.
';
  console.error(error);
 }
}
function renderCategories(){
 const box = document.getElementById("categories");
 box.innerHTML = "";
 addCategory("all","الكل");
 categories.forEach(cat=>{
  addCategory(String(cat.id),cat.name);
 });
}
function addCategory(id,name){
 const button = document.createElement("button");
 button.className = "cat" +
  (selectedCategory === id ? " selected":"");
 button.textContent = name;
 button.onclick = ()=>{
  selectedCategory = id;
  renderCategories();
  renderItems();
 };
 document.getElementById("categories").appendChild(button);
}
function renderItems(){
 const query = document.getElementById("search")
  .value.toLowerCase().trim();
 const filtered = items.filter(item=>{
  const categoryMatch =
   selectedCategory === "all" ||
   String(item.category_id) === selectedCategory;
  const searchMatch =
   (item.name || "").toLowerCase().includes(query);
  return categoryMatch && searchMatch && isAllowed(item);
 });
 document.getElementById("count").textContent =
  filtered.length + " عنصر";
 const box = document.getElementById("items");
 box.innerHTML = "";
 if(!filtered.length){
  box.innerHTML =
   '
لا توجد نتائج حالياً
';
  return;
 }
 filtered.forEach(item=>{
  const card = document.createElement("article");
  card.className = "item";
  const img = document.createElement("img");
  img.loading = "lazy";
  img.src = item.image || "";
  img.alt = item.name || "محتوى";
  img.onerror = ()=>{img.style.display="none"};
  const name = document.createElement("div");
  name.className = "item-name";
  name.textContent = item.name || "بدون اسم";
  const fav = document.createElement("button");
  fav.className = "fav";
  fav.textContent = favorites.has(String(item.id)) ? "♥":"♡";
  fav.onclick = event=>{
   event.stopPropagation();
   toggleFavorite(item.id);
   fav.textContent =
    favorites.has(String(item.id)) ? "♥":"♡";
  };
  card.append(img,name,fav);
  card.onclick = ()=>playItem(item);
  box.appendChild(card);
 });
}
function toggleFavorite(id){
 const key = String(id);
 if(favorites.has(key)){
  favorites.delete(key);
 }else{
  favorites.add(key);
 }
 try{
  localStorage.setItem(
   "alameeere_favorites",
   JSON.stringify([...favorites])
  );
 }catch(e){}
}
function playItem(item){
 document.getElementById("playingTitle").textContent =
  item.name || "ALAMEEERE TV";
 /*
  لا نستخدم رابط Xtream المباشر هنا.
  يسترجع Worker رابط تشغيل مصرحاً به.
 */
 playStream(item.id);
}
async function playStream(id){
 try{
  const data = await api(
   "/api/stream?type=" +
   encodeURIComponent(section) +
   "&id=" + encodeURIComponent(id)
  );
  if(!data.url) throw new Error("Stream URL missing");
  if(hls){
   hls.destroy();
   hls = null;
  }
  if(Hls.isSupported()){
   hls = new Hls();
   hls.loadSource(data.url);
   hls.attachMedia(player);
   hls.on(Hls.Events.MANIFEST_PARSED,()=>{
    player.play().catch(()=>{});
   });
  }else if(player.canPlayType("application/vnd.apple.mpegurl")){
   player.src = data.url;
   player.play().catch(()=>{});
  }else{
   throw new Error("HLS not supported");
  }
 }catch(error){
  alert("تعذر تشغيل المحتوى. تحقق من السيرفر.");
  console.error(error);
 }
}
try{
 favorites = new Set(
  JSON.parse(localStorage.getItem("alameeere_favorites") || "[]")
 );
}catch(e){}
loadSection("live");
</script>
</body>
</html>
