  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --accent: #e50914;
      --accent-hover: #b80710;
      --bg: #000000;
      --card-bg: #141414;
      --card-hover: #1f1f1f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    #appContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      background: #000000;
      overflow: hidden;
    }

    #videoWrapper {
      position: relative;
      flex: 1;
      height: 100%;
      background: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000000;
      outline: none;
      display: block;
      transition: object-fit 0.2s ease;
    }

    /* Video Aspect Modes */
    .mode-0 { object-fit: contain !important; }
    .mode-1 { object-fit: fill !important; }
    .mode-2 { object-fit: cover !important; }
    .mode-3 { object-fit: contain !important; aspect-ratio: 16/9 !important; }

    #screenDimmer {
      position: absolute;
      inset: 0;
      background: black;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }

    #centerLogo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 12;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #centerLogo img {
      width: 105px;
      height: 105px;
      border-radius: 24px;
      box-shadow: 0 0 35px rgba(229, 9, 20, 0.4);
    }
    #centerLogo .logo-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    #centerLogo .live-badge {
      color: var(--accent);
      background: rgba(229, 9, 20, 0.15);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid rgba(229, 9, 20, 0.3);
      font-size: 15px;
    }

    #gestureLayer {
      position: absolute;
      inset: 0;
      z-index: 10;
      touch-action: none;
    }

    #toastIndicator {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 15, 15, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .tap-ripple {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 35%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.06);
      opacity: 0;
      pointer-events: none;
      z-index: 25;
      transition: opacity 0.25s ease;
    }
    #tapLeft { left: 0; border-top-right-radius: 50%; border-bottom-right-radius: 50%; }
    #tapRight { right: 0; border-top-left-radius: 50%; border-bottom-left-radius: 50%; }

    #controlsOverlay {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(var(--sat) + 12px) calc(var(--sar) + 14px) calc(var(--sab) + 14px) calc(var(--sal) + 14px);
      background: linear-gradient(to bottom, rgba(0,0,0,0.88) 0%, transparent 22%, transparent 70%, rgba(0,0,0,0.92) 100%);
      opacity: 1;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    #controlsOverlay.hidden-controls {
      opacity: 0 !important;
      pointer-events: none !important;
    }
    #controlsOverlay > * {
      pointer-events: auto;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 65%;
    }
    .top-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .top-subtitle {
      font-size: 12px;
      color: #aaa;
      margin-top: 2px;
    }
    .top-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ctrl-btn {
      background: rgba(26, 26, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.15s, transform 0.1s, border-color 0.15s;
      outline: none;
    }
    .ctrl-btn:active {
      transform: scale(0.92);
      background: rgba(229, 9, 20, 0.3);
    }
    .ctrl-btn.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    .center-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      width: 100%;
    }
    .play-btn-large {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 25px rgba(229, 9, 20, 0.6);
      transition: transform 0.15s, background 0.15s;
    }
    .play-btn-large:active {
      transform: scale(0.92);
    }
    .seek-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      gap: 1px;
    }
    .seek-btn svg {
      width: 18px;
      height: 18px;
    }
    .seek-btn:active {
      transform: scale(0.92);
      background: rgba(255,255,255,0.15);
    }

    .bottom-bar {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .timeline-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .time-label {
      font-size: 13px;
      font-weight: 600;
      color: #ddd;
      font-variant-numeric: tabular-nums;
      min-width: 58px;
      text-align: center;
    }
    .slider-track {
      position: relative;
      flex: 1;
      height: 24px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .slider-bg {
      position: absolute;
      left: 0;
      right: 0;
      height: 6px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 3px;
      overflow: hidden;
    }
    .slider-fill {
      position: absolute;
      left: 0;
      height: 100%;
      background: var(--accent);
      width: 0%;
      border-radius: 3px;
      transition: width 0.1s linear;
    }
    .slider-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(0,0,0,0.8);
      pointer-events: none;
      left: 0%;
      transition: left 0.1s linear;
    }

    #drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      right: 0;
      width: 380px;
      max-width: 90vw;
      background: #111111;
      border-left: 1px solid #222;
      z-index: 60;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -6px 0 30px rgba(0,0,0,0.8);
    }
    #drawer.open {
      transform: translateX(0);
    }
    #drawerBackdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 55;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #drawerBackdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-header {
      padding: calc(var(--sat) + 12px) 14px 12px 14px;
      background: #181818;
      border-bottom: 1px solid #262626;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .drawer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drawer-title {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tabs-nav {
      display: flex;
      background: #0a0a0a;
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      text-align: center;
      border: none;
      background: transparent;
      color: #999;
      font-size: 13px;
      font-weight: 700;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: color 0.15s, background 0.15s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 14px;
      background: #141414;
      border-bottom: 1px solid #222;
    }
    .search-input-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-input-box input {
      width: 100%;
      background: #202020;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 9px 36px 9px 30px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input-box input:focus {
      border-color: var(--accent);
    }
    .search-icon {
      position: absolute;
      right: 12px;
      color: #888;
      pointer-events: none;
    }
    .search-clear-btn {
      position: absolute;
      left: 10px;
      background: none;
      border: none;
      color: #888;
      font-size: 16px;
      cursor: pointer;
      display: none;
    }
    .category-select {
      width: 100%;
      background: #202020;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    #itemsContainer {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      align-content: start;
    }
    #itemsContainer::-webkit-scrollbar {
      width: 5px;
    }
    #itemsContainer::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    .media-card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid #222;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .media-card:hover, .media-card:active {
      transform: translateY(-2px);
      border-color: #444;
    }
    .media-card.playing {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.4);
    }
    .poster-wrap {
      position: relative;
      width: 100%;
      padding-top: 145%;
      background: #1c1c1c;
      overflow: hidden;
    }
    .poster-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #1c1c1c;
    }
    .fav-btn {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.1s, color 0.15s;
    }
    .fav-btn.is-fav {
      color: #ffb703;
      background: rgba(0,0,0,0.85);
      border-color: #ffb703;
    }
    .media-info {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .media-title {
      font-size: 13px;
      font-weight: 700;
      color: #eee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .media-meta {
      font-size: 11px;
      color: #888;
      display: flex;
      justify-content: space-between;
    }

    #loadMoreBtn {
      grid-column: 1 / -1;
      background: #222;
      border: 1px solid #333;
      color: #eee;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      margin: 8px 0 16px 0;
      font-size: 13px;
      text-align: center;
    }

    #episodesModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 70;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }
    #episodesModal.open {
      display: flex;
    }
    .episodes-sheet {
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      background: #181818;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .episodes-header {
      padding: 14px 16px;
      background: #202020;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .season-pills {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      background: #141414;
      border-bottom: 1px solid #282828;
    }
    .season-pill {
      padding: 6px 14px;
      background: #242424;
      border: 1px solid #383838;
      border-radius: 20px;
      color: #aaa;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .season-pill.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .episodes-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .episode-item {
      background: #222;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.15s;
    }
    .episode-item:hover, .episode-item:active {
      background: #2c2c2c;
    }
    .episode-item.playing {
      border-color: var(--accent);
      background: rgba(229, 9, 20, 0.18);
    }
    .ep-num {
      font-weight: 800;
      color: var(--accent);
      font-size: 14px;
    }
    .ep-name {
      font-size: 13px;
      color: #eee;
      flex: 1;
      margin: 0 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ep-dur {
      font-size: 11px;
      color: #888;
    }

    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 10px;
      color: #777;
      font-size: 14px;
    }

    @media (min-width: 900px) {
      #drawer {
        position: relative;
        transform: none !important;
        width: 320px;
        box-shadow: none;
      }
      #drawerBackdrop {
        display: none !important;
      }
    }
  </style>
</head>

  function formatTime(sec) {
    if (isNaN(sec) || sec < 0) return "00:00";
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    if (h > 0) {
      return `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }
    return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;

    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const pos = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    const seekTime = pos * (video.duration || 0);
    sliderFill.style.width = (pos * 100) + "%";
    sliderThumb.style.left = (pos * 100) + "%";
    currentTimeLabel.innerText = formatTime(seekTime);
    return seekTime;
  }

      video.currentTime = finalT;
      window.removeEventListener("mousemove", onMove);

    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);

    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if (Math.abs(dy) > 20 && Math.abs(dy) > Math.abs(dx)) {
      isSwiping = true;
      const rect = gestureLayer.getBoundingClientRect();
      const isRightSide = touchStartX > (rect.width / 2);
      const delta = -dy / rect.height;

      if (isRightSide) {

  function renderCurrentItems() {
    const rawQuery = searchInput.value;
    const cleanQuery = normalizeSearchText(rawQuery);
    let displayList = currentItems;

    if (cleanQuery.length > 0) {
      searchClearBtn.style.display = "block";
      displayList = currentItems.filter(i => {
        const normName = normalizeSearchText(i.name || "");
        return normName.includes(cleanQuery);
      });
    } else {
      searchClearBtn.style.display = "none";
    }

    if (displayList.length === 0) {
      itemsContainer.innerHTML = `<div class="empty-state">لا توجد نتائج تطابق "${rawQuery}".</div>`;
      return;
    }

    itemsContainer.innerHTML = "";
    renderedCount = 0;
    appendItemsChunk(displayList);
  }

  function appendItemsChunk(list) {

      itemsContainer.appendChild(card);
    });
    renderedCount += nextBatch.length;

    const oldBtn = document.getElementById("loadMoreBtn");
    if (oldBtn) oldBtn.remove();

    if (renderedCount < list.length) {
      const loadMoreBtn = document.createElement("button");
      loadMoreBtn.id = "loadMoreBtn";
      loadMoreBtn.innerText = `عرض المزيد (${list.length - renderedCount} متبقي)`;
      loadMoreBtn.addEventListener("click", () => appendItemsChunk(list));
      itemsContainer.appendChild(loadMoreBtn);
    }

      </div>
    `;

    card.querySelector(".fav-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      toggleFav(item);
    });

    card.addEventListener("click", () => {
      if (isMovie) {
        playMovie(item);
      } else {
        openSeriesModal(item);
      }
    });

    return card;
  }

  function highlightPlayingCard(id) {
    document.querySelectorAll(".media-card").forEach(c => {
      if (c.dataset.id == id) c.classList.add("playing");
      else c.classList.remove("playing");
    });
  }

  function loadFavoritesView() {
    const favList = Object.values(favorites);
    currentItems = favList;
    renderCurrentItems();
  }

  let searchTimer = null;
  searchInput.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      renderCurrentItems();
    }, 150);
  });

  searchClearBtn.addEventListener("click", () => {
    searchInput.value = "";
    searchClearBtn.style.display = "none";
    renderCurrentItems();
  });

  tabMovies.addEventListener("click", () => {
    if (currentTab === "movies") return;
    currentTab = "movies";
    tabMovies.classList.add("active");
    tabSeries.classList.remove("active");
    tabFavs.classList.remove("active");
    searchInput.value = "";
    populateCategoryDropdown();
  });

  tabSeries.addEventListener("click", () => {
    if (currentTab === "series") return;
    currentTab = "series";
    tabSeries.classList.add("active");
    tabMovies.classList.remove("active");
    tabFavs.classList.remove("active");
    searchInput.value = "";
    populateCategoryDropdown();
  });

  tabFavs.addEventListener("click", () => {
    if (currentTab === "favs") return;
    currentTab = "favs";
    tabFavs.classList.add("active");
    tabMovies.classList.remove("active");
    tabSeries.classList.remove("active");
    searchInput.value = "";
    populateCategoryDropdown();
  });

  loadCategories();
})();
</script>
</body>
</html>
